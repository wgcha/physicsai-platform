[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicad"
dynamic = ["version"]
description = "Native geometry engine (R1 morphing): B-rep tagging, feature extraction, node-coordinate morphing"
requires-python = ">=3.12"
dependencies = [
  # OCP pin: cp312 win_amd64 wheel exists; build123d 0.10.0 (test extra) requires cadquery-ocp>=7.8,<7.9,
  # so installing the test extra does not replace this OCP build (contract geometry-engine.md section 5.1).
  "cadquery-ocp==7.8.1.1.post1",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
# Test/dev only. Never imported by runtime code and excluded from the deployment bundle.
test = [
  "build123d==0.10.0",
  "ocp_gordon==0.1.18",  # newer releases require OCP 7.9 (OCP.collections)
  "gmsh>=4.11,<5",
  "pytest>=8",
]

[project.scripts]
paicad = "paicad.cli:main"

[tool.setuptools.dynamic]
version = {attr = "paicad.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
