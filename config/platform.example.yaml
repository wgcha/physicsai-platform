# PhysicsAI 플랫폼 설정 예시 (계약: docs/contracts/platform.md §14, 2차 docs/contracts/phase2.md §8.2)
# 실제 파일은 config/platform.yaml (git 제외) 또는 PHYSICSAI_CONFIG 환경변수 경로.
# 경로 구분자는 '/'를 권장한다. ai_root·resources·입력 경로에는 공백과 & | < > ^ % ! " 를 쓰지 않는다.
# "사내 확인 후 교체" 표시는 원본 코드로 확인되지 않은 값이다.

schema_version: 1
profile: dev                      # dev | prod   (PHYSICSAI_PROFILE 환경변수 우선)

server:
  host: 127.0.0.1
  port: 8100
  frontend_root: null             # 백엔드가 /physicsai/ 아래에 직접 서빙할 프런트 빌드 폴더(절대경로, 예 D:/physicsai-platform/.runtime/frontend).
                                  # null = 서빙 안 함(Caddy 등 외부 서빙). 대시보드 Vite 프록시(/physicsai → 이 서버)로 접속하는 설치는 설정한다 —
                                  # deploy/setup.ps1이 <git>/.runtime/frontend로 넣는다. 폴더·index.html이 없으면 기동은 하고 환경 점검이 WARN
  # 경로 접두는 /physicsai 고정(API = /physicsai/api, 프런트 = /physicsai/). server.base_path는 예약(미사용) — 쓰면 경고

database:
  url_env: PHYSICSAI_DATABASE_URL # 예: postgresql+psycopg://physicsai_app:<비밀번호>@127.0.0.1:5432/physicsai
  pool_size: 5

auth:
  mode: dashboard                 # dashboard | dev_static | demo (dev_static은 profile=dev + 127.0.0.1 바인딩일 때만, demo는 시연 모드에서만)
  dashboard_internal_url: "http://127.0.0.1:8000"
  dashboard_public_login_url: "/"   # 로그인·"대시보드로" 링크(브라우저 기준 같은 origin 경로, 포트 무관). 운영 대시보드는 Vite가 WINDOWS_WEB_BASE_PATH(기본 /home/)에서 열림 — deploy/setup.ps1이 대시보드 .env 값으로 맞춤(값이 "/"이거나 없을 때만, 다른 값은 보존)
  cookie_name: analysis_canvas_session    # 대시보드 backend/app/security.py:45
  introspection_path: /api/auth/me
  projects_path: /api/projects
  cache_ttl_s: 30
  timeout_s: 3
  dev_static_principal:
    user_id: dev-admin
    username: dev
    display_name: 개발자
    is_global_admin: true
    memberships: []               # 예: [{project_id: "p-1", role: power}]

storage:
  ai_root: "E:/shared/AI_WORK"    # 임시 값. SPDM master 밖
  allowed_import_roots: []        # ③-4 모델 폴더 추가 허용 루트(읽기 전용). 예: ["F:/hpc_results"]
  spdm_roots: []                  # SPDM master 루트. 2차부터 이 하위가 SPDM 가져오기 허용 범위(읽기 전용, 쓰기 0)
  inbox_dir: "inbox"              # 받은 파일 폴더(AI 루트 기준 상대). 다른 PC는 이 폴더의 네트워크 공유에 복사한 뒤 화면 "찾아보기"로 고른다
  inbox_share_hint: null          # 화면 안내용 공유 경로(표시만). 예: "\\\\SERVER\\physicsai-inbox"

altair:                           # 하드코딩 금지 — 실행 파일 경로는 여기서만 (원본 common.py:25-37 키)
  version_label: "2026.1"
  hyperstudy_path: "C:/Program Files/Altair/2026.1/hwdesktop/hst/bin/win64/hstbatch.exe"
  simlab_path:     "C:/Program Files/Altair/2026.1/SimLab/bin/win64/SimLab.bat"
  edspy_path:      "C:/Program Files/Altair/2026.1/common/eds/win64/bin/win64/edspy.bat"
  hw_exe_path:     "C:/Program Files/Altair/2026.1/hwdesktop/hw/bin/win64/hw.exe"
  hvtrans_exe_path: "C:/Program Files/Altair/2026.1/hwdesktop/io/result_readers/bin/win64/hvtrans.exe"
  hstpy_path: ""                  # 2차. 빈 값 = hyperstudy_path 폴더의 hstpy.bat (원본 4_OPTIMIZATION/GUI:409-418)
  altair_home: ""                 # 2차. 빈 값 = hstpy 폴더/../../.. (원본 GUI:420-422)

resources:                        # 원본 반입본 위치(deploy/RESOURCES.txt). 절대경로·공백/메타문자 없음. prod면 존재해야 함. 빈 값 = 그 기능 비활성
  preview_pred_h3d_tcl: "D:/physicsai/resources/BATCHRUN/BATCHRUN_preview_pred_h3d.tcl"   # 1차
  batchrun_dir: "D:/physicsai/resources/BATCHRUN"          # 원본 CONFIG/BATCHRUN (런처 .py)
  pyd_dir: "D:/physicsai/resources/BUILD_PYD"              # 원본 BUILD_PYD (*.pyd) — 업로드본에 없음(U19)
  simlab_tpl_template: "D:/physicsai/resources/TEMPLATE/TEMAPLATE_simlab_parametered_mesh.tpl"   # 업로드본에 없음(U19)
  doe_design_type_json: "D:/physicsai/resources/DATA/DATA_doe_design_type.json"
  hypermesh_include_tcl: "D:/physicsai/resources/BATCHRUN/BATCHRUN_create_include_node_elem.tcl"  # 업로드본에 없음(U19)
  preview_h3d_tcl: "D:/physicsai/resources/BATCHRUN/BATCHRUN_preview_h3d.tcl"     # 업로드본에 없음(U19)
  preview_hg_tcl: "D:/physicsai/resources/BATCHRUN/BATCHRUN_preview_hg.tcl"       # 업로드본에 없음(U19)
  curate_hg_tcl: "D:/physicsai/resources/BATCHRUN/BATCHRUN_curate_hg.tcl"
  extract_minmax_tcl: "D:/physicsai/resources/BATCHRUN/H3D_StaticMinMax_to_CSV_FAST.tcl"   # 업로드본에 없음(U8·U19)
  contour_capture_tcl: ""          # ④ 컨투어 캡처 TCL(phase3 §15, 사용자 제공 이슈 #2). 빈 값 = 저장소 resources/hyperview/contour_capture.tcl(setup.ps1이 채움)
  launchers:                      # 런처 파일 이름(경로 구분자 없이)·pyd 코어 이름
    extract_params: {script: BATCHRUN_get_parameter_from_cad.py, core: get_parameter_from_cad_core}
    gen_radioss:    {script: BATCHRUN_hst_gen_radioss_input.py,   core: hst_gen_radioss_core}
    optimization:   {script: BATCHRUN_hst_physicsai_optimization.py, core: hst_physicsai_optimization_core}
  # GPU 조회 실행 파일 자동 탐색 후보(phase3 D3-45): worker.gpu_query 첫 인자가 비었거나 못 찾으면 순서대로 시도.
  # 이름만 쓰면 PATH에서 찾고, %SystemRoot%·%ProgramFiles% 같은 환경변수는 확장한다(경로 하드코딩 없음)
  gpu_query_candidates: ["nvidia-smi", "%SystemRoot%\\System32\\nvidia-smi.exe", "%ProgramFiles%\\NVIDIA Corporation\\NVSMI\\nvidia-smi.exe"]

worker:
  limiter: auto                   # auto | windows_job | posix | null (null은 dev만)
  max_logical_cores: 32
  max_memory_gb: 64
  priority: below_normal          # idle | below_normal | normal
  auto_detect: false              # true면 min(설정값, 감지값 × auto_detect_ratio)
  auto_detect_ratio: 0.7
  posix_rlimit_as: false          # PosixLimiter에서 RLIMIT_AS로 메모리 상한 적용 여부
  heartbeat_interval_s: 10
  lease_ttl_s: 60
  claim_interval_s: 2
  cancel_check_interval_s: 2
  resource_sample_interval_s: 10
  env_passthrough: []             # Altair 자식 프로세스에 추가로 넘길 환경변수 이름 패턴(fnmatch). DB URL·비밀은 항상 제외
  state_dir: "./state"            # 단일 인스턴스 잠금 파일 위치
  # GPU 조회 argv(제한기 밖, gpu_query_timeout_s). 첫 인자를 못 찾으면 resources.gpu_query_candidates로 자동 탐색(D3-45)
  gpu_query: ["nvidia-smi", "--query-gpu=name,utilization.gpu,memory.used,memory.total", "--format=csv,noheader,nounits"]
  gpu_query_timeout_s: 15         # nvidia-smi 조회 제한 시간(1~120초, 워커 GPU 조회·환경 점검 gpu.detect 공통)
  gpu_backoff_after: 3            # GPU 조회가 이 횟수만큼 연속 실패하면 조회 간격을 두 배씩 늘림(1~100)
  gpu_backoff_max_s: 300          # 늘린 간격 상한(0 = 늘리지 않음, 아니면 resource_sample_interval_s~3600초)
  # 작업 실행 시간 한도 없음(의도적으로 작업 timeout 키를 두지 않는다 — gpu_query_timeout_s는 GPU 조회 전용)

dataset:
  holdout_ratio: 0.1
  seed: 20261008
  split_group: file               # file | parent_dir
  min_h3d_files: 2
  min_psdata_bytes: 1048576       # 원본 검사(1 MiB)
  options_default:
    extract_faces: true
    extract_mdi: false
    extract_time_history_vectors: false

package:
  link_mode: hardlink_or_copy     # hardlink_or_copy | copy

training_log:
  log_globs: ["*.log", "*.txt"]
  max_curve_points: 2000
  parsers:                        # 순서대로 시도, 1줄 이상 일치한 첫 파서 채택. 필수 그룹: epoch, loss (선택: total)
    - name: physicsai_default     # 원본 3_PHYSICS_AI/GUI/3_gui_training.py:16
      pattern: 'epoch=\s*(?P<epoch>\d+)\s*/\s*(?P<total>\d+)\s+loss=(?P<loss>[0-9.eE+\-]+)'

score:
  write_files: false              # true면 edspy --write-files
  parsers: []                     # 점수 형식 미확정(U6). 예:
  #  - {name: generic, pattern: '^\s*(?P<name>[A-Za-z][A-Za-z0-9_ ]{0,40})\s*[:=]\s*(?P<value>[-+0-9.eE]+)\s*$'}

param_set:
  max_samples: 20000
  max_total_bytes: 2147483648     # 2 GiB
  discover_max_depth: 4           # "프로젝트 폴더에서 찾기" 탐색 깊이(phase3 §13 S8)
  discover_max_entries: 5000      # 탐색 항목 수 상한(넘으면 truncated)
  discover_tpl_max_bytes: 1048576 # tpl 읽기 크기 상한(1 MiB)
  tpl_export_regex: 'dir_file_export\s*=\s*r?"[^"]*"'   # tpl 내보내기 줄(원본 tpl:110). 값 ≠ predict.simlab_mesh_name이면 등록 경고 SIMLAB_EXPORT_NAME(phase3 §14.4)

predict:
  rendered_script_name: simlab_parametered_mesh.py   # U2 확정(phase3 §11.2)
  simlab_mesh_name: EPS_mesh_0000.rad                # 원본 tpl:110 dir_file_export — GEOM_UPDATE 성공 판정 파일
  mesh_include_name: 104_replace_node_elem.inc       # 원본 m_2 출력(U3) — 서버 확인(E4-0-2) 후 다르면 이 값만 교체
  renum_csv_name: RENUM_INIT.csv                     # 조립 폴더(radioss_assem)의 번호 재지정 표
  mesh_log_complete_marker: "COMPLETE HM BATCHRUN"   # HyperMesh include TCL 로그(log_batch.txt) 끝 표식
  starter_glob: "*_0000.rad"
  prepared_input_exts: [".rad", ".hm"]               # 준비된 입력 예측(phase3 §11.5) 파일 확장자
  prepared_max_files: 500
  prepared_max_total_bytes: 2147483648               # 2 GiB
  integer_rounding: half_up       # half_up | truncate (U9)
  env:
    EDS_TNS_ACTVN_CHCKPT: "1"     # 원본 4_OPTIMIZATION/FUNC/1_physicsai_opti.py:319

predict_batch:                    # ④ 일괄 예측(DOE)(phase3 §14.5). 동시 실행 수는 작업 생성 때 사용자가 1~train_data.max_multi_execution으로 입력
  max_runs: 200                   # 조합 수 상한(2~2000) — LHS 개수 2~max_runs, 표 행 1~max_runs
  table_max_bytes: 1048576        # 표 붙여넣기·CSV 크기 상한(1 MiB)
  dir_name: "04_batch"            # Study 직계 배치 폴더(<study>/04_batch/B-003/run__00001/m_1·m_2·m_3)
  curve_max_runs: 200             # 커브 겹쳐보기 run 상한

capture:                          # ④ 예측 컨투어 캡처(phase3 §15 S10): 예측 끝에 HyperView 배치로 방향별 PNG·동영상. 실패는 경고만
  enabled: true                   # false = 끔. altair.hw_exe_path가 비어도 꺼짐(/status features.contour_capture)
  views: ["iso", "front", "top", "right"]   # 기본 방향(iso front back top bottom left right). 템플릿·작업 display.views가 우선
  video: true                     # 방향마다 애니메이션 동영상도 저장
  video_ext: "mp4"                # mp4 | gif | avi(allow_avi: true일 때만 — 아니면 설정 경고 + 실제 mp4)
  allow_avi: false                # avi는 브라우저가 재생하지 못한다(phase3 §21.4.4 S16)
  video_scope: "page"             # page | window — TCL `hwc save animation <scope>`(서버 확인 E4-14-V7)
  video_target_bytes: 1048576     # 표시용 영상 목표 크기(1 MiB, 64 KiB~max_video_bytes). 변환이 있으면 이 크기 이하가 될 때까지 단계 재인코딩
  use_last: true                  # 마지막 프레임 기준 캡처(false = 첫 프레임)
  default_field: "CornerStress"   # 템플릿 표시 설정·응답 정의가 없을 때 결과 필드(PhysicsAI 예측 h3d 응력 — hwc result scalar load type=CornerStress)
  default_component: "vonMises"   # 성분이 비었고 결과 필드가 default_field일 때 성분(component= "vonMises", 실패 시 type만 재시도). "" = 없음
  timeout_s: 1800                 # 캡처 1회 상한(초, 1~86400, null = 없음). 넘으면 HyperView를 종료하고 경고
  max_video_bytes: 209715200      # 동영상 1개 등록·제공 상한(200 MiB)
  # 일괄 예측 화면 "캡처 예상" 참고 문구의 가정값(서버 실측 아님): 방향 1개당 이미지·영상 크기(MB), 캡처 시간(초)
  estimate_image_mb: 0.3
  estimate_video_mb: 1
  estimate_sec_per_view: 20
  estimate_sec_per_video: 40
  ffmpeg:                         # 선택적 영상 변환(H.264·yuv420p·faststart mp4). 원본은 media/raw/에 보존
    exe: ""                       # ffmpeg 실행 파일 절대경로. 빈 값 = 변환 안 함
    probe_exe: ""                 # ffprobe 절대경로(선택). 빈 값 = 코덱 확인 안 함
    args: ["-hide_banner", "-loglevel", "error", "-y", "-i", "{video_in}", "-an",
           "-vf", "scale=trunc(iw*{scale}/2)*2:trunc(ih*{scale}/2)*2,fps={fps}",
           "-c:v", "libx264", "-preset", "veryfast", "-crf", "{crf}", "-pix_fmt", "yuv420p", "-movflags", "+faststart", "{video_out}"]
    probe_args: ["-v", "error", "-select_streams", "v:0", "-show_entries", "stream=codec_name,pix_fmt", "-of", "default=nw=1", "{video_in}"]
    ladder:                       # 차례로 시도해 video_target_bytes 이하인 첫 결과를 쓴다(scale 0.1~1.0, crf 0~51, fps 1~60)
      - {scale: 1.0, crf: 28, fps: 15}
      - {scale: 0.75, crf: 30, fps: 12}
      - {scale: 0.5, crf: 32, fps: 10}
      - {scale: 0.5, crf: 38, fps: 8}
    timeout_s: 300                # 변환 1회 상한(초)

fem_verify:                       # ④ 조립 FEM 검증(phase3 §21 S16): 예측 설계점을 조립 상태 Radioss로 해석(PBS·SCX)해 예측과 비교
  enabled: true
  dir_name: "04_verify"           # Study 직계 폴더(FV-001/a1/…)
  max_active: 4                   # Study당 진행 중(예측 대기·해석 중) 검증 상한, 1~20
  field_map: {}                   # 예측 h3d 결과 이름 → FEM h3d 결과 이름(예: {"CornerStress": "Element Stresses (2D & 3D)"}) — 서버 확인 E4-14-F2
  legend_subcase: 1               # 같은 범례 min·max를 읽을 subcase(≥1)
  auto_isolate_cushion: true      # mesh_only 템플릿이면 FEM 컨투어를 쿠션 include의 /PART id로 격리(E4-14-F3)
  zero_tol: 1.0e-12               # 오차% 기준값(FEM)이 이 값 이하면 오차% 없음("기준값 0")
  max_assem_files: 500            # 조립 원본 파일 수 상한
  max_assem_bytes: 2147483648     # 조립 원본 합계 크기 상한(2 GiB)
  include_scan_max_bytes: 16777216   # #include 참조 검사 대상 파일 크기 상한(16 MiB)
  max_pred_h3d_copy_bytes: 4294967296  # 예측 응답 재추출용 h3d 사본 상한(4 GiB)

commands:
  # argv 템플릿. 허용 placeholder는 계약 §9.2. 펼침 토큰: @cmd_c, @write_files, @hooks_arg
  edspy_create_dataset: ["{edspy}", "--physicsai", "--create-dataset", "{out_psdata}", "--spec", "{spec_yaml}"]       # 원본 1_create_dataset.py:90
  edspy_score: ["{edspy}", "--physicsai", "--score", "{score_path}", "--model", "{model_psmdl}", "--dataset", "{eval_psdata}", "@write_files"]   # 원본 4_testing.py:62-64
  geom_update: ["{simlab}", "-auto", "{rendered_script}", "-nographics"]    # U2 확정(1_create_tpl_file.py:45). 성공 = predict.simlab_mesh_name 생성
  mesh: ["{hw}", "-clientconfig", "hwfepre.dat", "-b", "-tcl", "{include_tcl}", "{simlab_mesh}", "{mesh_inc}", "{renum_csv}"]   # 원본 ⑤ m_2(phase3 §11.4). null = SKIPPED(SimLab이 include를 직접 쓰는 변형)
  rad_assemble: null                                                      # 선택. null = 복사 규칙만(phase3 §11.4)
  edspy_predict: ["@cmd_c", "{edspy}", "--physicsai", "--predict-write", "{pred_h3d}", "--model", "{model_psmdl}", "--input-file", "{starter}", "@hooks_arg"]   # 원본 1_physicsai_opti.py:310-316
  contour_preview: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{preview_tcl}", "-input", "{pred_h3d_fwd}", "-output", "{preview_json_fwd}"]   # 원본 1_physicsai_opti.py:230-231
  response_extract: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{extract_tcl}"]   # 원본 ⑤ m_4(phase3 §14.6): H3D_REQUESTS.txt → RESPONSES.txt. {extract_tcl} 없는 옛 형태({out_csv} 직접 작성)도 허용
  contour_capture: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{capture_tcl}"]   # phase3 §15: {capture_tcl} = P/RESULT/media/contour_capture.tcl(옆에 capture_settings.tcl). 키가 없으면 이 값
  # ---- 2차(phase2 §8.1) 원본 인용 기본값. null이면 그 기능만 비활성 ----
  simlab_extract_params: ["{simlab}", "-auto", "{launcher}", "{cad_file}", "{xml_out}", "-nographics"]              # 1_create_tpl_file.py:45
  hst_gen_radioss: ["{hstbatch}", "-multiexec", "{multi_execution}", "-pyfile", "{launcher}"]                          # 2_run_hst_gen_rad_input.py:39
  h3d_preview: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{preview_tcl}", "-h3d", "{h3d}", "-result", "{result_json}"]   # 1_curate_h3d.py:29-36
  hvtrans_curate: ["{hvtrans}", "-c", "{cfg}", "{h3d}", "{h3d}", "-o", "{out_h3d}", "-z0"]                              # 1_curate_h3d.py:267-273
  t01_preview: ["{hw}", "-clientconfig", "hwplot.dat", "-b", "-c", "-tcl", "{preview_tcl}", "-input", "{t01}", "-output", "{result_json}"]   # 2_curate_t0.py:37-45
  t01_curve_export: ["{hw}", "-clientconfig", "hwplot.dat", "-b", "-c", "-tcl", "{curate_tcl}", "-config", "{config_json}"]   # 2_curate_t0.py:198-205
  hst_optimization: ["@cmd_c", "{hstpy}", "{launcher}"]                                                                 # 1_physicsai_opti.py:120-122

commands_log_error_patterns:      # edspy 계열 step 로그 오류 감지 (원본 2_run_hst_gen_rad_input.py:65-67)
  - '^\s*\d+\s+Error\s*:'
  - 'Traceback \(most recent call last\):'
  - '^\s*\[ERROR\]'

hpc:
  gateway: none                   # none | command | adapter(미구현) | scx(SCX — 대시보드 relay 경유)  (PHYSICSAI_HPC_GATEWAY 우선). 기본 none
  poll_interval_s: 60
  lost_after_polls: 10
  max_unreachable_minutes: 1440
  defaults: {queue: "workq", ncpus: 16, walltime: "24:00:00"}
  command:
    # ※ PBS Pro 형태의 placeholder 예시. 사내 확인 후 교체(U1)
    allowed_executables:
      - "C:/Program Files/PBS/exec/bin/qsub.exe"
      - "C:/Program Files/PBS/exec/bin/qstat.exe"
      - "C:/Program Files/PBS/exec/bin/qdel.exe"
    submit: ["C:/Program Files/PBS/exec/bin/qsub.exe", "-N", "{job_name}", "-q", "{queue}",
             "-l", "select=1:ncpus={ncpus}", "-l", "walltime={walltime}",
             "-v", "INPUT_FILE={input_file},RESULT_DIR={result_dir}",
             "/shared/scripts/radioss_run.pbs"]
    status: ["C:/Program Files/PBS/exec/bin/qstat.exe", "-x", "-f", "{external_job_id}"]
    cancel: ["C:/Program Files/PBS/exec/bin/qdel.exe", "{external_job_id}"]
    job_id_regex: '^\s*(?P<job_id>\d+(?:\.[A-Za-z0-9_.\-]+)?)\s*$'
    state_regex: 'job_state\s*=\s*(?P<state>[A-Z])'
    exit_code_regex: 'Exit_status\s*=\s*(?P<exit>-?\d+)'
    not_found_regex: 'Unknown Job Id'
    state_map: {Q: QUEUED, H: QUEUED, W: QUEUED, T: QUEUED, S: QUEUED, B: RUNNING, R: RUNNING, E: RUNNING, F: FINISHED, X: FINISHED}
    submit_timeout_s: 60
    status_timeout_s: 30
    cancel_timeout_s: 30
  # adapter.module: 예약(미사용) — 사내 어댑터 job API 확인 전까지 미구현. 쓰면 경고
  transfer:
    # stage_in: 예약(미사용, 항상 공유 경로) — 쓰면 경고
    path_map:                     # 이 PC 경로 → PBS 노드 경로. 사내 확인 후 교체
      - {local: "E:/shared/AI_WORK", remote: "/shared/AI_WORK"}
    collect_mode: in_place        # in_place | shared_folder | drive(= shared_folder 별칭, 가정 A-7)
    collect_root_local: ""        # shared_folder/drive: 이 PC에서 읽는 결과 루트(읽기 전용, AI 루트·SPDM과 비중첩)
    collect_root_remote: ""       # 같은 루트의 PBS 노드 경로
    collect_patterns: ["*.h3d", "*T01", "*_0000.out", "*_0001.out"]
    max_collect_bytes: 21474836480
  scx:                            # gateway: scx일 때만 사용(phase3 §16.8 — 대시보드 SCX relay 경유 Radioss 제출, 관리자 매뉴얼 §16)
    relay_url: ""                 # 대시보드 relay(loopback만): http://127.0.0.1:<대시보드 백엔드 포트>
    secret_file: ""               # "" = <런타임>/secrets/scx_relay_key(대시보드 SIMDASH_SCX_RELAY_SECRET_FILE과 같은 값의 파일 — 값은 여기 쓰지 않음)
    drive_base: "~"               # "~"(= 공용 계정 홈 /Users/vd.dashboard) 또는 "~/<상대>"(예 "~/physicsai")
    home_display: "/Users/vd.dashboard"   # 표시 전용
    appliance: ""                 # 필수 — SCX Radioss appliance 이름(서버 확인 E4-11-1)
    version: ""                   # 필수 — Radioss 버전 문자열(E4-11-2)
    ncpu: 16                      # 작업 params hpc.ncpus가 있으면 덮어씀
    memory_gb: null
    queue_type: implicit
    run_type: "both - use starter and engine files"
    mpi: "SMP (default)"
    single_precision: false
    poll_interval_s: null         # null = hpc.poll_interval_s
    max_download_bytes: 21474836480
    stage_patterns: ["*.rad", "*.inc", "*.csv"]   # 입력 폴더 직속 파일 중 올릴 것(하위 폴더는 올리지 않음)
    list_additional_paths: true   # include를 additional_paths에 나열(E4-11-4)
    max_stage_bytes: 21474836480
    stage_poll_s: 5
    stage_timeout_s: 7200
    submit_replay_attempts: 3     # 응답을 잃은 제출은 같은 request_id로만 replay(중복 제출 아님)
    submit_replay_wait_s: 10
    http_timeout_s: 30
    transfer_timeout_s: 3600
    collect_max_depth: 2
    health_ttl_s: 30

train_data:                       # ① 학습데이터(phase2 §6.2~§6.6). 기본값은 원본 인용
  cad_extensions: [".prt"]
  max_xml_bytes: 4194304
  extract_progress_token: "Passed"          # 원본 1_create_tpl_file.py:18
  extract_progress_total: 4                 # 원본 :51
  param_default_range_ratio: 0.05           # 원본 1_gui_create_tpl_file.py:299-300
  param_default_format: "%3i"               # 원본 1_create_tpl_file.py:171
  tpl_marker: "#***************************************************************"     # 원본 :159
  tpl_prt_regex: 'dir_file_prt\s*=\s*r"[^"]*"'
  tpl_parameter_line_regex: '(?m)^[^\n]*\{parameter\(.*?\)\}[^\n]*\n?'
  tpl_paramitem_line_regex: '(?m)^[^\n]*<paramitem[^>]*/>[^\n]*\n?'
  max_runs: 2000
  recommended_doe_type: "TYPE_LATINHYPERCUBE"   # ① DOE 생성 화면 추천(기본 선택) 유형 value — DATA_doe_design_type.json의 value. 빈 문자열 = 추천 없음(첫 항목)
  max_multi_execution: 8
  hst_progress_regex: 'Finished run\s*\(\s*(?P<run>\d+)\s*\),\s*model\s*\(\s*m_?3\s*\)'   # 원본 2_run_hst_gen_rad_input.py:59-61
  hst_log_error_patterns:                   # 원본 :64-71
    - '^\s*\d+\s+Error\s*:'
    - 'Traceback \(most recent call last\):'
    - '^\s*\[ERROR\]'
    - '^\s*(?:FileNotFoundError|RuntimeError|ValueError|OSError|PermissionError|ImportError|TypeError|AttributeError|NameError|SyntaxError)\s*:'
  run_dir_glob:                              # run 폴더 패턴 목록(DOE 폴더 기준, 문자열 1개도 허용). 실제 HyperStudy 출력 = HST_GEN_RADIOSS_INPUT/approaches/doe_1/run__N(이슈 #7)
    - "approaches/doe_*/run__*"
    - "*/approaches/doe_*/run__*"
  samples_extractor: paramitem              # paramitem | csv | none (U18)
  rendered_tpl_glob: "**/*"
  rendered_tpl_exts: [".py", ".tcl", ".txt", ".xml", ""]
  samples_scan_max_bytes: 1048576
  paramitem_regex: '<paramitem\s+Name="(?P<name>[^"]+)"\s+NewValue="(?P<value>[^"]*)"'
  samples_csv_glob: null
  samples_csv_run_column: run_key
  max_runs_per_submit: 500
  result_run_dir_regex: '^(?P<run_key>run__\d+)$'   # 사내 확인 후 교체(U25)
  result_match_depth: 3
  doe_generator_default: platform            # ①-3 화면 기본 생성 방식: platform(동시 실행) | hyperstudy(원본 hstbatch 호환)
  platform_parallel_default: 4               # 플랫폼 생성 동시 실행 수 화면 기본(실제 = min(값, max_multi_execution)) — Altair 라이선스 한도 안에서
  platform_max_runs: 500                     # 플랫폼 표본 run 상한(≤ max_runs)
  platform_run_root: approaches/doe_1        # 플랫폼 run 폴더 상위(DOE 폴더 기준). <값>/run__00001이 run_dir_glob 패턴 중 하나와 맞아야 함

curation:
  max_files: 20000

spdm_import:
  patterns: ["*.h3d", "*T01"]
  max_files: 20000
  max_total_bytes: 536870912000     # 500 GiB

optimize:
  default_study_folder: HST_PHYSICSAI_OPTIMIZATION   # 원본 GUI:847
  env: {EDS_TNS_ACTVN_CHCKPT: "1"}                   # 원본 1_physicsai_opti.py:113
  progress_regex: 'Started\s+run\s+\(\s*(?P<run>\d+)\s*\),\s*model\s+\(\s*m_1\s*\)'   # 원본 :384
  max_listed_files: 5000
  viewable_globs: ["*.csv", "*.txt", "*.json", "*.log"]
  max_viewable_files: 200
  summary_parsers: []               # 형식 미확정(U28). 예: [{name: opt_csv, glob: "*.csv", kind: csv_table, max_rows: 1000}]

surrogate_opt:                      # ⑤ 플랫폼 내장 최적화(phase3 §18 S13): ④ 예측 체인으로 검증하는 대리모델(GP·RBF) 최적화. numpy·scipy 필요
  enabled: true
  dir_name: 05_opt/surrogate        # Study 기준 폴더(<study>/05_opt/surrogate/SO-001)
  max_variables: 20                 # 자유 변수 상한
  max_iterations: 10
  max_candidates: 10
  default_iterations: 3             # 화면 기본값: 반복 3 × 후보 4, 개선 기준 1%, GP
  default_candidates: 4
  default_tol_rel: 0.01
  default_surrogate: gp             # gp | rbf
  gp_restarts: 8                    # GP 하이퍼파라미터 최적화 시작점 수
  de_maxiter: 200                   # 후보 탐색(differential_evolution) 세대 수·개체 배수
  de_popsize: 15
  fit_timeout_s: 600                # 반복 1회 학습+후보 탐색 시간 한도
  blas_threads: 4                   # 워커 안 numpy 계산 스레드 상한(worker.max_logical_cores와 작은 쪽)
  max_objectives: 3                 # 다목적(phase3 §22 S17): 목적 1~3 · 관찰 ≤ 10 · 추가 검증 점 ≤ 10
  max_observe: 10
  max_extra_points: 10
  mo_lattice_h2: 10                 # 예측 전선 가중 격자(2목적 11점·3목적 28점)
  mo_lattice_h3: 6
  mo_de_maxiter: 100                # 예측 전선·ParEGO 후보 탐색 세대 수
  mo_rho: 0.05                      # 증강 Chebyshev ρ(0~1)
  mo_ref_offset: 0.1                # HV 기준점 1 + offset(0.01~1)
  mo_gp_restarts: 4                 # ParEGO 스칼라화 GP 재시작 수
  mo_hvi_share_m3: 0.5              # 3목적: HVI 활용 후보 ⌈k·비율⌉개(0 = 1개)
  mo_front_prox_m3: 6.0             # 3목적: ParEGO 후보를 예측 전선 가까이(0 = 끔)

env_check:
  probe_timeout_s: 60               # 점검용 짧은 실행만의 상한(작업 step 시간 한도 아님)
  expire_s: 900
  min_free_gb: 50
  probes:                           # 짧은 실행 argv. null = 존재·실행 가능 확인만(기본). 인자는 사내 확인 후(U32)
    edspy: null
    simlab: null
    hw: null
    hstbatch: null
    hvtrans: null
    hstpy: null

error_bundle:
  log_tail_bytes: 262144            # 로그 파일당 꼬리 상한
  max_total_bytes: 20971520         # zip 전체(압축 전) 상한

study_storage:                      # Study 용량 계산·정리(3차 S3). 절이 없으면 아래 기본값
  max_entries: 2000000              # 스캔 항목 상한(1000~50000000). 닿으면 부분 스캔(정리 불가)
  top_files: 20                     # 큰 파일 표 개수(1~200)
  max_items_per_category: 500       # 정리 범주별 후보 상한(10~5000, 큰 것부터)
  log_min_age_days: 30              # 작업 로그 정리 후보 최소 경과일(0~3650)
  keep_failed_logs: 10              # 실패·중단 작업 로그 중 최근 몇 개는 정리하지 않음(0~1000)
  stale_after_hours: 24             # 계산 결과 유효 시간(1~720). 지나면 다시 계산해야 정리 가능

notifications:
  retention_days: 30
  purge_interval_h: 6

ui:
  max_artifact_bytes: 20971520
  poll_job_running_ms: 2000
  poll_job_queued_ms: 5000
  poll_job_waiting_hpc_ms: 15000
  poll_log_ms: 2000
  poll_queue_ms: 5000
  poll_resources_ms: 10000
  poll_notifications_ms: 10000
  poll_status_ms: 30000

logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR | CRITICAL
  dir: ""                         # 운영 파일 로그(backend.log·worker.log). 빈 값 = 작업 폴더 ./logs = <install_root>\logs. ai_root·SPDM 밖
  max_mb: 20                      # 파일당 최대 MB — 넘으면 회전(backend.log.1 …)
  backups: 10                     # 회전 보관 개수
  mask_patterns:                  # 외부 프로그램 출력 저장 전 값 마스킹
    - '(?i)(password|passwd|token|secret)\s*[=:]\s*\S+'

demo:                             # 시연 모드(fake tools 배포판, deploy/demo/). 운영에서는 false 유지 — true는 profile=dev + server.host=127.0.0.1에서만 허용
  enabled: false
  frontend_root: ""               # 시연 때 백엔드가 직접 서빙할 프런트 빌드 폴더(Caddy 없이). enabled=false면 빈 값
