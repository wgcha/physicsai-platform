# PhysicsAI CI — Linux(scripts/test-all.sh: pytest(packages/simdash_adapters 시험 포함) + PostgreSQL 18 + 프런트) / Windows(pytest 전체 + Job Object 실제 시험 + 배포·시연 스크립트)
# 완료 기준(AGENTS.md): scripts/test-all이 Linux에서 통과. Windows 전용 시험은 windows 잡에서 skip 없이 실행(skip = 실패).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 실행 환경은 대시보드와 같게(decisions 2026-10-13): Python 3.12.13(.python-version), Node 22.23.2(.node-version), PostgreSQL 18
env:
  PG_MAJOR: "18"
  PHYSICSAI_REQUIRE_PG_MAJOR: "18"   # backend/tests: 시험 서버가 18인지 확인
  UV_VERSION: "0.11.32"              # Windows Python 3.12.13 — 대시보드 bootstrap-runtime.ps1과 같은 uv 고정본
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  linux:
    name: Linux · test-all (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            deploy/requirements.lock
            pyproject.toml
            packages/simdash_adapters/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: PostgreSQL 18 (공식 PGDG apt 저장소 — 시험마다 임시 클러스터, backend/tests 픽스처)
        run: |
          bin="/usr/lib/postgresql/${PG_MAJOR}/bin"
          if [ ! -x "$bin/initdb" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends "postgresql-${PG_MAJOR}"
          fi
          "$bin/initdb" --version
          "$bin/initdb" --version | grep -q " ${PG_MAJOR}\." || { echo "PostgreSQL ${PG_MAJOR}이 아닙니다"; exit 1; }
          echo "PG_BIN=$bin" >> "$GITHUB_ENV"
          echo "PHYSICSAI_TEST_PGBIN=$bin" >> "$GITHUB_ENV"

      - name: 실행 환경 버전 확인(대시보드와 동일 — Python 3.12.13, Node 22.23.2)
        run: |
          python -c "import platform, sys; v = platform.python_version(); print('Python', v); sys.exit(v != open('.python-version').read().strip())"
          test "$(node --version)" = "$(cat .node-version)" || { echo "Node $(node --version) != $(cat .node-version)"; exit 1; }

      - name: Python 의존성(공통 어댑터 패키지 → deploy/requirements.lock 고정 버전)
        # simdash-adapters는 PyPI에서 받지 않는다(lock에 없음) — 저장소 소스로 먼저 설치한다(phase3.md §6.5·D3-27)
        run: |
          python -m pip install ./packages/simdash_adapters
          python -m pip install -r deploy/requirements.lock "pytest>=8" "pytest-timeout>=2.2"

      - name: pwsh 확인(deploy·scripts *.ps1 구문 검사 시험용)
        run: pwsh --version

      - name: scripts/test-all.sh (pytest + openapi 최신 여부 + vitest + tsc)
        env:
          PYTHON: python
        run: |
          set -o pipefail
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/test-all.log" || {
            rc=$?
            python scripts/ci_annotate.py "$RUNNER_TEMP/test-all.log" "test-all 실패"
            exit $rc
          }

      - name: 오프라인 묶음 dry-run
        run: bash deploy/collect-offline.sh --dry-run

      - name: simdash-adapters wheel 단독 설치(V3-S4-6 — 빈 venv에 wheel만, 인덱스 없이)
        run: bash scripts/check-adapters-wheel.sh "$RUNNER_TEMP/simdash-wheel"

  windows:
    name: Windows · pytest 전체 + Job Object + 배포·시연
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      PHYSICSAI_REQUIRE_WINDOWS_TESTS: "1"   # @pytest.mark.windows 시험이 skip되면 실패로 바꾼다(backend/tests 픽스처)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 임시 폴더를 공백·~ 없는 경로로
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Python 3.12.13(uv 관리 런타임 — 대시보드 .tools 배치와 같은 모양) + 시험용 venv
        # setup-python의 Windows 목록에는 3.12.13이 없다 → 대시보드처럼 uv python install. 가짜 대시보드 폴더
        # (RUNNER_TEMP\dash\.tools\python\cpython-3.12.13-windows-x86_64-none)에 설치해 install의 dashboard_root 시험에도 쓴다.
        run: |
          $want = (Get-Content .python-version -Raw).Trim()
          $uvZip = Join-Path $env:RUNNER_TEMP 'uv.zip'
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvZip
          Expand-Archive $uvZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'uv') -Force
          $uv = Join-Path $env:RUNNER_TEMP 'uv\uv.exe'
          $dash = Join-Path $env:RUNNER_TEMP 'dash'
          $pyDir = Join-Path $dash '.tools\python'
          & $uv python install $want --install-dir $pyDir --no-registry
          if ($LASTEXITCODE) { throw "uv python install $want 실패" }
          $base = Join-Path $pyDir "cpython-$want-windows-x86_64-none\python.exe"
          if (-not (Test-Path $base)) { Get-ChildItem $pyDir; throw "Python 경로가 대시보드 배치와 다릅니다: $base" }
          $venv = Join-Path $env:RUNNER_TEMP 'py312'
          & $base -m venv $venv
          if ($LASTEXITCODE) { throw 'venv 생성 실패' }
          (Join-Path $venv 'Scripts') >> $env:GITHUB_PATH
          "DASHBOARD_ROOT=$dash" >> $env:GITHUB_ENV
          $v = & (Join-Path $venv 'Scripts\python.exe') -c 'import platform; print(platform.python_version())'
          Write-Host "Python $v ($base)"
          if ($v.Trim() -ne $want) { throw "Python $v != $want" }
          $n = (node --version).Trim()
          if ($n -ne (Get-Content .node-version -Raw).Trim()) { throw "Node $n" }

      - name: Python 의존성(공통 어댑터 패키지 → deploy/requirements.lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/simdash_adapters
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r deploy/requirements.lock "pytest>=8" "pytest-timeout>=2.2"

      - name: PostgreSQL 18(러너 기본 설치본이 18이면 그 서비스, 아니면 EDB 공식 zip 바이너리로 클러스터)
        run: |
          $major = $env:PG_MAJOR
          $bin = $env:PGBIN
          $runnerMajor = $null
          if ($bin -and (Test-Path (Join-Path $bin 'psql.exe'))) {
            $vtxt = & (Join-Path $bin 'psql.exe') --version
            if ("$vtxt" -match '(\d+)\.\d+') { $runnerMajor = $Matches[1] }
            Write-Host "러너 기본 PostgreSQL: $vtxt ($bin)"
          }
          if ($runnerMajor -eq $major) {
            $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
            if (-not $svc) { throw '러너에 PostgreSQL 서비스가 없습니다' }
            Set-Service -Name $svc.Name -StartupType Manual
            Start-Service -Name $svc.Name
            $user = $env:PGUSER; $pw = $env:PGPASSWORD; $port = 5432
          } else {
            # 러너 기본이 18이 아니면 EDB 공식 Windows zip 바이너리(18.x 최신부터 시도)로 시험 전용 클러스터를 띄운다
            $zip = Join-Path $env:RUNNER_TEMP 'pgsql.zip'
            $got = $null
            foreach ($minor in 12..0) { foreach ($build in 1..2) {
              if ($got) { break }
              $url = "https://get.enterprisedb.com/postgresql/postgresql-$major.$minor-$build-windows-x64-binaries.zip"
              try { Invoke-WebRequest $url -OutFile $zip -UseBasicParsing; $got = $url } catch { }
            } }
            if (-not $got) { throw "PostgreSQL $major Windows zip을 받지 못했습니다" }
            Write-Host "받은 바이너리: $got"
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'pg18') -Force
            $bin = Join-Path $env:RUNNER_TEMP 'pg18\pgsql\bin'
            $user = 'postgres'; $pw = [guid]::NewGuid().ToString('N'); $port = 5433
            Write-Host "::add-mask::$pw"
            $pwFile = Join-Path $env:RUNNER_TEMP 'pgpw.txt'
            Set-Content -Path $pwFile -Value $pw -NoNewline -Encoding ascii
            $data = Join-Path $env:RUNNER_TEMP 'pg18data'
            & (Join-Path $bin 'initdb.exe') -D $data -U $user -A scram-sha-256 --pwfile=$pwFile -E UTF8 --no-locale
            if ($LASTEXITCODE) { throw 'initdb 실패' }
            Remove-Item $pwFile
            & (Join-Path $bin 'pg_ctl.exe') -D $data -l (Join-Path $env:RUNNER_TEMP 'pg18.log') -w -o "-p $port -c listen_addresses=127.0.0.1 -c max_connections=300" start
            if ($LASTEXITCODE) { Get-Content (Join-Path $env:RUNNER_TEMP 'pg18.log') -Tail 50; throw 'pg_ctl start 실패' }
          }
          $env:PGPASSWORD = $pw
          & (Join-Path $bin 'pg_isready.exe') -h 127.0.0.1 -p $port -t 60
          if ($LASTEXITCODE) { throw 'PostgreSQL 준비 안 됨' }
          $num = & (Join-Path $bin 'psql.exe') -h 127.0.0.1 -p $port -U $user -d postgres -tAc 'SHOW server_version_num'
          if ($LASTEXITCODE) { throw 'PostgreSQL 접속 실패' }
          Write-Host "server_version_num=$num"
          if ([math]::Floor([int]"$num".Trim() / 10000) -ne [int]$major) { throw "PostgreSQL $major 이 아닙니다: $num" }
          # 시험 픽스처는 이 URL로 시험마다 DB를 만든다. install·시연 단계는 PGBIN·PGUSER·PGPASSWORD·PG_PORT를 쓴다
          "PHYSICSAI_TEST_DATABASE_URL=postgresql+psycopg://$($user):$($pw)@127.0.0.1:$port/postgres" >> $env:GITHUB_ENV
          "PGBIN=$bin" >> $env:GITHUB_ENV
          "PG_BIN=$bin" >> $env:GITHUB_ENV
          "PHYSICSAI_TEST_PGBIN=$bin" >> $env:GITHUB_ENV
          "PGUSER=$user" >> $env:GITHUB_ENV
          "PGPASSWORD=$pw" >> $env:GITHUB_ENV
          "PG_PORT=$port" >> $env:GITHUB_ENV
          # 가짜 대시보드 .env(대시보드 .env.example 형식) — install의 dashboard_root·start-demo -DashboardRoot 시험용. 비밀번호는 가짜이며 읽히면 안 된다
          $dashSecret = 'dash-' + [guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$dashSecret"
          Set-Content -Path (Join-Path $env:DASHBOARD_ROOT '.env') -Encoding utf8 -Value @(
            '# fake dashboard .env (CI)',
            "DATABASE_URL=postgresql+psycopg://simdashboard_app:$dashSecret@127.0.0.1:$port/simulation_dashboard",
            "POSTGRES_BIN=$bin")
          "DASH_ENV_SECRET=$dashSecret" >> $env:GITHUB_ENV

      - name: Windows 전용 시험(V-JO-1~3·CREATE_SUSPENDED·V2-EC-4) — skip 없이
        env:
          PYTHONIOENCODING: utf-8
          PHYSICSAI_CI_MEASURE_FILE: ${{ runner.temp }}\jobobject-measure.jsonl
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pytest-windows.log'
          cmd /c "python -m pytest -q -rfEs -m windows 2>&1" | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if (Test-Path $env:PHYSICSAI_CI_MEASURE_FILE) { Get-Content $env:PHYSICSAI_CI_MEASURE_FILE | ForEach-Object { Write-Host "::notice title=Job Object 실측::$_" } }
          if ($rc) { python scripts/ci_annotate.py $log 'Windows 전용 시험 실패'; exit $rc }

      - name: pytest 전체(fake tools .exe 런처 + 실제 Job Object 제한기 + 시연 E2E)
        env:
          PYTHONUTF8: "1"   # 시험 코드의 기본 인코딩 읽기·쓰기용(제품 코드는 encoding 명시)
          PYTHONIOENCODING: utf-8
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pytest-all.log'
          cmd /c "python -m pytest -q -rfEs --tb=short 2>&1" | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc) { python scripts/ci_annotate.py $log 'pytest 전체 실패' 400; exit $rc }

      - name: PowerShell 구문 검사(pwsh 7 + Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        run: |
          $files = @(Get-ChildItem deploy, scripts -Recurse -Filter *.ps1)
          $bad = 0
          foreach ($f in $files) {
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err.Count) { $bad++; $err | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" } }
            # install.bat 등은 Windows PowerShell 5.1(powershell.exe)로 실행된다 — BOM 없는 UTF-8 한글이 깨지지 않는지 확인
            $cmd = "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$($f.FullName)', [ref]`$null, [ref]`$e) | Out-Null; if (`$e.Count) { `$e | % { `$_.Message }; exit 1 }"
            powershell.exe -NoProfile -Command $cmd
            if ($LASTEXITCODE) { $bad++; Write-Host "::error file=$($f.FullName)::Windows PowerShell 5.1 구문 오류" }
          }
          Write-Host "검사한 파일: $($files.Count)"
          if ($bad) { exit 1 }

      - name: 오프라인 묶음 만들기(collect-offline.ps1 실제 실행)
        if: ${{ !cancelled() }}
        run: |
          ./deploy/collect-offline.ps1
          if (-not (Test-Path dist/wheels/*.whl)) { throw 'wheels 없음' }
          if (-not (Test-Path dist/wheels/simdash_adapters-0.1.0-py3-none-any.whl)) { throw 'simdash-adapters wheel 없음' }
          if (-not (Test-Path dist/frontend/index.html)) { throw '프런트 빌드 없음' }
          if (-not (Test-Path dist/deploy/demo/fake_tools/fake_hw)) { throw '시연 가짜 도구 없음' }
          Get-ChildItem physicsai-offline-*.zip | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: install.ps1 실제 설치(시연 설정, 임시 폴더, 작업 스케줄러 등록·조회·해제)
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stepLog = Join-Path $env:RUNNER_TEMP ('step-' + [guid]::NewGuid().ToString('N') + '.log')
          try {
            $t = $env:RUNNER_TEMP
            $root = Join-Path $t 'pinstall'
            $port = 8195
            # 시연 설정(가짜 도구·자원)을 설치 대상 config_path에 미리 만든다 → install.ps1은 "기존 설정 유지"
            python deploy/demo/demo_setup.py init --root (Join-Path $t 'pdemo') --port $port --frontend dist/frontend | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { throw 'demo init 실패' }
            $cfgPath = Join-Path $t 'pdemo\config\platform.yaml'
            # 대시보드 환경 재사용(dashboard_root): 가짜 대시보드 .env(POSTGRES_BIN·DATABASE_URL) + .tools 고정 Python 3.12.13
            # → deploy.json에 python_exe·pg_bin·pg_host·pg_port를 쓰지 않아도 대시보드 값으로 채워져야 한다(비밀번호는 읽지 않음)
            $deployJson = @{
              install_root = $root; dashboard_root = $env:DASHBOARD_ROOT
              db_name = 'physicsai'; db_role = 'physicsai_app'; config_path = $cfgPath; service_user = "$env:USERDOMAIN\$env:USERNAME"
              run_mode = 'Interactive'; caddy_frontend_root = (Join-Path $root 'frontend\dist')
            } | ConvertTo-Json
            $jsonPath = Join-Path $t 'deploy.json'
            Set-Content -Path $jsonPath -Value $deployJson -Encoding utf8
            # 무인 설치: 비밀번호는 프로세스 환경변수로만(명령 인자 금지)
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $env:PGPASSWORD
            $env:PHYSICSAI_INSTALL_DB_PASSWORD = [guid]::NewGuid().ToString('N')
            cmd /c "dist\deploy\install.bat -ConfigFile $jsonPath -PasswordsFromEnv -NoStart 2>&1" | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { throw "install.bat 실패($LASTEXITCODE)" }
            $instOut = Get-Content $stepLog -Raw
            if (-not $instOut.Contains('pg_bin, pg_host, pg_port, python_exe')) { throw 'dashboard_root 기본값이 채워지지 않았습니다' }
            if ($instOut -notmatch 'PostgreSQL .*18\d{4}') { throw 'install이 PostgreSQL 18 서버를 확인하지 못했습니다' }
            if ($instOut.Contains('simdashboard_app') -or $instOut.Contains($env:DASH_ENV_SECRET)) { throw '대시보드 DB 사용자·비밀번호가 출력에 나왔습니다' }
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $null
            $env:PHYSICSAI_INSTALL_DB_PASSWORD = $null
            # 작업 스케줄러 등록 조회: ExecutionTimeLimit 0(PT0S)·재시작 999·IgnoreNew
            foreach ($n in 'PhysicsAI-Backend', 'PhysicsAI-Worker') {
              $task = Get-ScheduledTask -TaskName $n
              $s = $task.Settings
              Write-Host "$n : ExecutionTimeLimit=$($s.ExecutionTimeLimit) RestartCount=$($s.RestartCount) MultipleInstances=$($s.MultipleInstances) Execute=$($task.Actions[0].Execute) $($task.Actions[0].Arguments)"
              if ($s.ExecutionTimeLimit -ne 'PT0S') { throw "$n ExecutionTimeLimit=$($s.ExecutionTimeLimit) (PT0S 필요)" }
              if ($s.RestartCount -ne 999) { throw "$n RestartCount=$($s.RestartCount)" }
              if ("$($s.MultipleInstances)" -ne 'IgnoreNew') { throw "$n MultipleInstances=$($s.MultipleInstances)" }
            }
            # 설치된 venv로 백엔드 health(작업 스케줄러 시작 → 안 되면 venv 직접 실행으로 설치본 검증)
            $health = "http://127.0.0.1:$port/physicsai/api/health"
            function Test-Health { try { (Invoke-RestMethod -Uri $health -TimeoutSec 3).status -eq 'ok' } catch { $false } }
            Start-ScheduledTask -TaskName 'PhysicsAI-Backend'
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health }
            $info = Get-ScheduledTaskInfo -TaskName 'PhysicsAI-Backend'
            Write-Host "작업 스케줄러 시작 결과: health=$ok LastTaskResult=$($info.LastTaskResult)"
            $direct = $null
            if (-not $ok) {
              Write-Host '::warning::러너 세션에서 Interactive 작업이 시작되지 않음 — 설치된 venv로 직접 기동해 설치본을 검증합니다'
              Stop-ScheduledTask -TaskName 'PhysicsAI-Backend' -ErrorAction SilentlyContinue
              $env:PHYSICSAI_CONFIG = [Environment]::GetEnvironmentVariable('PHYSICSAI_CONFIG', 'Machine')
              $env:PHYSICSAI_DATABASE_URL = [Environment]::GetEnvironmentVariable('PHYSICSAI_DATABASE_URL', 'Machine')
              $direct = Start-Process -FilePath (Join-Path $root 'venv\Scripts\python.exe') -ArgumentList '-m', 'physicsai_api.serve' `
                -WorkingDirectory $root -RedirectStandardOutput (Join-Path $t 'backend.out.log') -RedirectStandardError (Join-Path $t 'backend.err.log') -PassThru
              for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health }
              if (-not $ok) { Get-Content (Join-Path $t 'backend.err.log') -Tail 80; throw '설치본 백엔드 health 실패' }
            }
            Write-Host "health OK: $health"
            if ($direct) { Stop-Process -Id $direct.Id -Force }
            Stop-ScheduledTask -TaskName 'PhysicsAI-Backend' -ErrorAction SilentlyContinue
            # 등록 해제(uninstall-tasks.ps1) → 조회 시 없어야 한다
            $savedPsm = $env:PSModulePath; $env:PSModulePath = $null   # 5.1이 pwsh 7 모듈 경로를 물려받지 않게
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File dist\deploy\uninstall-tasks.ps1
            $env:PSModulePath = $savedPsm
            if ($LASTEXITCODE) { throw 'uninstall-tasks 실패' }
            foreach ($n in 'PhysicsAI-Backend', 'PhysicsAI-Worker') {
              if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "$n 이 남아 있습니다" }
            }
          } catch {
            $msg = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            Write-Host ('::error title=install 예외::' + ($msg -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            if (Test-Path $stepLog) { python scripts/ci_annotate.py $stepLog 'install 출력' 150 }
            foreach ($f in @((Join-Path $env:RUNNER_TEMP 'backend.err.log'))) { if ($f -and (Test-Path $f)) { python scripts/ci_annotate.py $f "install $(Split-Path -Leaf $f)" 60 } }
            throw
          }

      - name: 저장소 모드 시연(GitHub #1 재현 — PATH 첫 python이 실패하는 가짜 pyenv shim, -DashboardRoot의 Python 3.12 → <DemoRoot>\venv) → API로 ①-1 → stop-demo.bat
        if: ${{ !cancelled() }}
        env:
          PHYSICSAI_NO_PAUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $stepLog = Join-Path $env:RUNNER_TEMP ('step-' + [guid]::NewGuid().ToString('N') + '.log')
          $savedPath = $env:PATH
          try {
            $demo = Join-Path $env:RUNNER_TEMP 'demo'
            $port = 8196
            # 사용자 PC 재현: pyenv-win shim(전역 버전 미설정)이 PATH 맨 앞 → python 실행이 실패한다
            $shim = Join-Path $env:RUNNER_TEMP 'fake-pyenv-shims'
            New-Item -ItemType Directory -Force -Path $shim | Out-Null
            Set-Content -Path (Join-Path $shim 'python.bat') -Encoding ascii -Value @(
              '@echo off',
              'echo No global/local python version has been set yet. Please set the global version by typing: 1>&2',
              'echo pyenv global 3.7.4 1>&2',
              'exit /b 1')
            $env:PATH = "$shim;$env:PATH"
            $first = (Get-Command python -CommandType Application | Select-Object -First 1).Source
            if ($first -ne (Join-Path $shim 'python.bat')) { throw "가짜 shim이 PATH 첫 python이 아닙니다: $first" }
            cmd /c "python -c `"print(1)`" >nul 2>&1"
            if ($LASTEXITCODE -eq 0) { throw '가짜 shim이 실패하지 않습니다(재현 조건 아님)' }
            if (Test-Path (Join-Path $PWD 'wheels')) { throw '저장소 루트에 wheels가 있으면 묶음 모드가 됩니다' }
            cmd /c "deploy\demo\start-demo.bat -DemoRoot $demo -Port $port -DashboardRoot `"$env:DASHBOARD_ROOT`" -PgPort 55433 -NoBrowser -ToolDelay 0 2>&1" | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { Get-ChildItem "$demo\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }; throw "start-demo 실패($LASTEXITCODE)" }
            # 시연 venv는 대시보드 Python 3.12로 만들어져야 한다(pyvenv.cfg home — 콘솔 한글 인코딩과 무관하게 파일로 확인)
            $dashPyDir = @(Get-ChildItem (Join-Path $env:DASHBOARD_ROOT '.tools\python') -Directory -Filter 'cpython-3.12.*')[0].FullName
            $cfgTxt = Get-Content (Join-Path $demo 'venv\pyvenv.cfg') -Raw
            Write-Host $cfgTxt
            if ($cfgTxt -notmatch ('(?im)^home\s*=\s*' + [regex]::Escape($dashPyDir) + '\s*$')) { throw "시연 venv가 대시보드 Python 3.12로 만들어지지 않았습니다" }
            $stamp = Join-Path $demo 'venv\physicsai-repo-deps.sha256'
            if (-not (Test-Path $stamp)) { throw '의존성 설치 기록 파일이 없습니다' }
            $stampTime = (Get-Item $stamp).LastWriteTimeUtc
            # 대시보드 런타임에는 설치하지 않는다(fastapi가 없어야 한다)
            $dashPy = Join-Path $dashPyDir 'python.exe'
            & $dashPy -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('fastapi') else 0)"
            if ($LASTEXITCODE) { throw '대시보드 Python에 fastapi가 설치되었습니다' }
            try {
              $base = "http://127.0.0.1:$port"
              $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
              Invoke-WebRequest "$base/physicsai/api/demo/login" -Method Post -Body @{ role = 'power' } -WebSession $s | Out-Null
              $st = Invoke-RestMethod "$base/physicsai/api/status" -WebSession $s
              if (-not $st.demo) { throw '/status.demo가 true가 아닙니다' }
              for ($i = 0; $i -lt 30 -and -not $st.worker.online; $i++) { Start-Sleep 1; $st = Invoke-RestMethod "$base/physicsai/api/status" -WebSession $s }
              Write-Host "worker online=$($st.worker.online) limiter=$($st.worker.limiter)"
              if ($st.worker.limiter -ne 'windows_job') { throw "Windows 제한기가 아닙니다: $($st.worker.limiter)" }
              $studies = @(Invoke-RestMethod "$base/physicsai/api/studies?project_id=demo" -WebSession $s | ForEach-Object { $_ })
              $sid = ($studies | Where-Object { $_.folder_name -eq 'demo_bracket' } | Select-Object -First 1).id
              if (-not $sid) { throw "시연 Study를 찾지 못했습니다: $($studies | ConvertTo-Json -Depth 3 -Compress)" }
              $cad = ($demo -replace '\\', '/') + '/ai_root/demo_bracket/00_inbox/cad/demo_bracket.prt'
              $body = @{ job_type = 'TD_EXTRACT_PARAMS'; params = @{ cad_path = $cad } } | ConvertTo-Json
              $j = Invoke-RestMethod "$base/physicsai/api/studies/$sid/jobs" -Method Post -WebSession $s -Headers @{ 'X-PhysicsAI-Request' = '1' } -ContentType 'application/json; charset=utf-8' -Body $body
              for ($i = 0; $i -lt 60; $i++) {
                Start-Sleep 1
                $jd = Invoke-RestMethod "$base/physicsai/api/jobs/$($j.id)" -WebSession $s
                if ($jd.state -in 'SUCCEEDED', 'FAILED', 'CANCELED', 'INTERRUPTED') { break }
              }
              Write-Host "①-1 결과: $($jd.state) $($jd.failure_code) $($jd.failure_message)"
              if ($jd.state -ne 'SUCCEEDED') { $jd | ConvertTo-Json -Depth 6; throw '시연 ①-1 실패' }
            } finally {
              cmd /c "deploy\demo\stop-demo.bat -DemoRoot $demo"
            }
            # 다시 시작: 의존성은 기록 해시로 건너뛴다(시연 venv 재사용)
            $log2 = Join-Path $env:RUNNER_TEMP 'demo-restart.log'
            try {
              cmd /c "deploy\demo\start-demo.bat -DemoRoot $demo -Port $port -DashboardRoot `"$env:DASHBOARD_ROOT`" -PgPort 55433 -NoBrowser -ToolDelay 0 2>&1" | Tee-Object -FilePath $log2
              if ($LASTEXITCODE) { throw "start-demo 재시작 실패($LASTEXITCODE)" }
              if ((Get-Item $stamp).LastWriteTimeUtc -ne $stampTime) { throw '재시작에서 의존성 설치를 건너뛰지 않았습니다(기록 파일이 다시 쓰임)' }
            } finally {
              cmd /c "deploy\demo\stop-demo.bat -DemoRoot $demo"
            }
          } catch {
            $env:PATH = $savedPath
            $msg = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            Write-Host ('::error title=demo 예외::' + ($msg -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            if (Test-Path $stepLog) { python scripts/ci_annotate.py $stepLog 'demo 출력' 150 }
            foreach ($f in @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'demo\logs') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object FullName)) { if ($f -and (Test-Path $f)) { python scripts/ci_annotate.py $f "demo $(Split-Path -Leaf $f)" 60 } }
            throw
          }
