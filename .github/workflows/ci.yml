# PhysicsAI CI — Linux(scripts/test-all.sh: pytest(packages/simdash_adapters 시험 포함) + PostgreSQL 18 + 프런트) / Windows(pytest 전체 + Job Object 실제 시험 + 배포·시연 스크립트)
# 완료 기준(AGENTS.md): scripts/test-all이 Linux에서 통과. Windows 전용 시험은 windows 잡에서 skip 없이 실행(skip = 실패).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 실행 환경은 대시보드와 같게(decisions 2026-10-13): Python 3.12.13(.python-version), Node 22.23.2(.node-version), PostgreSQL 18
env:
  PG_MAJOR: "18"
  PHYSICSAI_REQUIRE_PG_MAJOR: "18"   # backend/tests: 시험 서버가 18인지 확인
  UV_VERSION: "0.11.32"              # Windows Python 3.12.13 — 대시보드 bootstrap-runtime.ps1과 같은 uv 고정본
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  linux:
    name: Linux · test-all (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            deploy/requirements.lock
            pyproject.toml
            packages/simdash_adapters/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: PostgreSQL 18 (공식 PGDG apt 저장소 — 시험마다 임시 클러스터, backend/tests 픽스처)
        run: |
          bin="/usr/lib/postgresql/${PG_MAJOR}/bin"
          if [ ! -x "$bin/initdb" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends "postgresql-${PG_MAJOR}"
          fi
          "$bin/initdb" --version
          "$bin/initdb" --version | grep -q " ${PG_MAJOR}\." || { echo "PostgreSQL ${PG_MAJOR}이 아닙니다"; exit 1; }
          echo "PG_BIN=$bin" >> "$GITHUB_ENV"
          echo "PHYSICSAI_TEST_PGBIN=$bin" >> "$GITHUB_ENV"

      - name: 실행 환경 버전 확인(대시보드와 동일 — Python 3.12.13, Node 22.23.2)
        run: |
          python -c "import platform, sys; v = platform.python_version(); print('Python', v); sys.exit(v != open('.python-version').read().strip())"
          test "$(node --version)" = "$(cat .node-version)" || { echo "Node $(node --version) != $(cat .node-version)"; exit 1; }

      - name: Python 의존성(공통 어댑터 패키지 → deploy/requirements.lock 고정 버전)
        # simdash-adapters는 PyPI에서 받지 않는다(lock에 없음) — 저장소 소스로 먼저 설치한다(phase3.md §6.5·D3-27)
        run: |
          python -m pip install ./packages/simdash_adapters
          python -m pip install -r deploy/requirements.lock "pytest>=8" "pytest-timeout>=2.2"

      - name: pwsh 확인(deploy·scripts *.ps1 구문 검사 시험용)
        run: pwsh --version

      - name: scripts/test-all.sh (pytest + openapi 최신 여부 + vitest + tsc)
        env:
          PYTHON: python
        run: |
          set -o pipefail
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/test-all.log" || {
            rc=$?
            python scripts/ci_annotate.py "$RUNNER_TEMP/test-all.log" "test-all 실패"
            exit $rc
          }

      - name: 오프라인 묶음 dry-run
        run: bash deploy/collect-offline.sh --dry-run

      - name: simdash-adapters wheel 단독 설치(V3-S4-6 — 빈 venv에 wheel만, 인덱스 없이)
        run: bash scripts/check-adapters-wheel.sh "$RUNNER_TEMP/simdash-wheel"

  windows:
    name: Windows · pytest 전체 + Job Object + 배포·시연
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      PHYSICSAI_REQUIRE_WINDOWS_TESTS: "1"   # @pytest.mark.windows 시험이 skip되면 실패로 바꾼다(backend/tests 픽스처)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 임시 폴더를 공백·~ 없는 경로로
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Python 3.12.13(uv 관리 런타임 — 대시보드 .tools 배치와 같은 모양) + 시험용 venv
        # setup-python의 Windows 목록에는 3.12.13이 없다 → 대시보드처럼 uv python install. 가짜 대시보드 폴더
        # (RUNNER_TEMP\dash\.tools\python\cpython-3.12.13-windows-x86_64-none)에 설치해 install의 dashboard_root 시험에도 쓴다.
        run: |
          $want = (Get-Content .python-version -Raw).Trim()
          $uvZip = Join-Path $env:RUNNER_TEMP 'uv.zip'
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvZip
          Expand-Archive $uvZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'uv') -Force
          $uv = Join-Path $env:RUNNER_TEMP 'uv\uv.exe'
          $dash = Join-Path $env:RUNNER_TEMP 'dash'
          $pyDir = Join-Path $dash '.tools\python'
          & $uv python install $want --install-dir $pyDir --no-registry
          if ($LASTEXITCODE) { throw "uv python install $want 실패" }
          $base = Join-Path $pyDir "cpython-$want-windows-x86_64-none\python.exe"
          if (-not (Test-Path $base)) { Get-ChildItem $pyDir; throw "Python 경로가 대시보드 배치와 다릅니다: $base" }
          $venv = Join-Path $env:RUNNER_TEMP 'py312'
          & $base -m venv $venv
          if ($LASTEXITCODE) { throw 'venv 생성 실패' }
          (Join-Path $venv 'Scripts') >> $env:GITHUB_PATH
          "DASHBOARD_ROOT=$dash" >> $env:GITHUB_ENV
          $v = & (Join-Path $venv 'Scripts\python.exe') -c 'import platform; print(platform.python_version())'
          Write-Host "Python $v ($base)"
          if ($v.Trim() -ne $want) { throw "Python $v != $want" }
          $n = (node --version).Trim()
          if ($n -ne (Get-Content .node-version -Raw).Trim()) { throw "Node $n" }

      - name: Python 의존성(공통 어댑터 패키지 → deploy/requirements.lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/simdash_adapters
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r deploy/requirements.lock "pytest>=8" "pytest-timeout>=2.2"

      - name: PostgreSQL 18(러너 기본 설치본이 18이면 그 서비스, 아니면 EDB 공식 zip 바이너리로 클러스터)
        run: |
          $major = $env:PG_MAJOR
          $bin = $env:PGBIN
          $runnerMajor = $null
          if ($bin -and (Test-Path (Join-Path $bin 'psql.exe'))) {
            $vtxt = & (Join-Path $bin 'psql.exe') --version
            if ("$vtxt" -match '(\d+)\.\d+') { $runnerMajor = $Matches[1] }
            Write-Host "러너 기본 PostgreSQL: $vtxt ($bin)"
          }
          if ($runnerMajor -eq $major) {
            $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
            if (-not $svc) { throw '러너에 PostgreSQL 서비스가 없습니다' }
            Set-Service -Name $svc.Name -StartupType Manual
            Start-Service -Name $svc.Name
            $user = $env:PGUSER; $pw = $env:PGPASSWORD; $port = 5432
          } else {
            # 러너 기본이 18이 아니면 EDB 공식 Windows zip 바이너리(18.x 최신부터 시도)로 시험 전용 클러스터를 띄운다
            $zip = Join-Path $env:RUNNER_TEMP 'pgsql.zip'
            $got = $null
            foreach ($minor in 12..0) { foreach ($build in 1..2) {
              if ($got) { break }
              $url = "https://get.enterprisedb.com/postgresql/postgresql-$major.$minor-$build-windows-x64-binaries.zip"
              try { Invoke-WebRequest $url -OutFile $zip -UseBasicParsing; $got = $url } catch { }
            } }
            if (-not $got) { throw "PostgreSQL $major Windows zip을 받지 못했습니다" }
            Write-Host "받은 바이너리: $got"
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'pg18') -Force
            $bin = Join-Path $env:RUNNER_TEMP 'pg18\pgsql\bin'
            $user = 'postgres'; $pw = [guid]::NewGuid().ToString('N'); $port = 5433
            Write-Host "::add-mask::$pw"
            $pwFile = Join-Path $env:RUNNER_TEMP 'pgpw.txt'
            Set-Content -Path $pwFile -Value $pw -NoNewline -Encoding ascii
            $data = Join-Path $env:RUNNER_TEMP 'pg18data'
            & (Join-Path $bin 'initdb.exe') -D $data -U $user -A scram-sha-256 --pwfile=$pwFile -E UTF8 --no-locale
            if ($LASTEXITCODE) { throw 'initdb 실패' }
            Remove-Item $pwFile
            & (Join-Path $bin 'pg_ctl.exe') -D $data -l (Join-Path $env:RUNNER_TEMP 'pg18.log') -w -o "-p $port -c listen_addresses=127.0.0.1 -c max_connections=300" start
            if ($LASTEXITCODE) { Get-Content (Join-Path $env:RUNNER_TEMP 'pg18.log') -Tail 50; throw 'pg_ctl start 실패' }
          }
          $env:PGPASSWORD = $pw
          & (Join-Path $bin 'pg_isready.exe') -h 127.0.0.1 -p $port -t 60
          if ($LASTEXITCODE) { throw 'PostgreSQL 준비 안 됨' }
          $num = & (Join-Path $bin 'psql.exe') -h 127.0.0.1 -p $port -U $user -d postgres -tAc 'SHOW server_version_num'
          if ($LASTEXITCODE) { throw 'PostgreSQL 접속 실패' }
          Write-Host "server_version_num=$num"
          if ([math]::Floor([int]"$num".Trim() / 10000) -ne [int]$major) { throw "PostgreSQL $major 이 아닙니다: $num" }
          # 시험 픽스처는 이 URL로 시험마다 DB를 만든다. install·시연 단계는 PGBIN·PGUSER·PGPASSWORD·PG_PORT를 쓴다
          "PHYSICSAI_TEST_DATABASE_URL=postgresql+psycopg://$($user):$($pw)@127.0.0.1:$port/postgres" >> $env:GITHUB_ENV
          "PGBIN=$bin" >> $env:GITHUB_ENV
          "PG_BIN=$bin" >> $env:GITHUB_ENV
          "PHYSICSAI_TEST_PGBIN=$bin" >> $env:GITHUB_ENV
          "PGUSER=$user" >> $env:GITHUB_ENV
          "PGPASSWORD=$pw" >> $env:GITHUB_ENV
          "PG_PORT=$port" >> $env:GITHUB_ENV
          # 가짜 대시보드 .env(대시보드 .env.example 형식) — install의 dashboard_root·start-demo -DashboardRoot 시험용. 비밀번호는 가짜이며 읽히면 안 된다
          $dashSecret = 'dash-' + [guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$dashSecret"
          Set-Content -Path (Join-Path $env:DASHBOARD_ROOT '.env') -Encoding utf8 -Value @(
            '# fake dashboard .env (CI)',
            "DATABASE_URL=postgresql+psycopg://simdashboard_app:$dashSecret@127.0.0.1:$port/simulation_dashboard",
            "POSTGRES_BIN=$bin",
            'WINDOWS_WEB_PORT=8080',
            'WINDOWS_WEB_BASE_PATH=/home/')
          "DASH_ENV_SECRET=$dashSecret" >> $env:GITHUB_ENV

      - name: Windows 전용 시험(V-JO-1~3·CREATE_SUSPENDED·V2-EC-4) — skip 없이
        env:
          PYTHONIOENCODING: utf-8
          PHYSICSAI_CI_MEASURE_FILE: ${{ runner.temp }}\jobobject-measure.jsonl
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pytest-windows.log'
          cmd /c "python -m pytest -q -rfEs -m windows 2>&1" | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if (Test-Path $env:PHYSICSAI_CI_MEASURE_FILE) { Get-Content $env:PHYSICSAI_CI_MEASURE_FILE | ForEach-Object { Write-Host "::notice title=Job Object 실측::$_" } }
          if ($rc) { python scripts/ci_annotate.py $log 'Windows 전용 시험 실패'; exit $rc }

      - name: pytest 전체(fake tools .exe 런처 + 실제 Job Object 제한기 + 시연 E2E)
        env:
          PYTHONUTF8: "1"   # 시험 코드의 기본 인코딩 읽기·쓰기용(제품 코드는 encoding 명시)
          PYTHONIOENCODING: utf-8
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pytest-all.log'
          cmd /c "python -m pytest -q -rfEs --tb=short 2>&1" | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc) { python scripts/ci_annotate.py $log 'pytest 전체 실패' 400; exit $rc }

      - name: PowerShell 구문 검사(pwsh 7 + Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        run: |
          $files = @(Get-ChildItem deploy, scripts -Recurse -Filter *.ps1)
          $bad = 0
          foreach ($f in $files) {
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err.Count) { $bad++; $err | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" } }
            # install.bat 등은 Windows PowerShell 5.1(powershell.exe)로 실행된다 — BOM 없는 UTF-8 한글이 깨지지 않는지 확인
            $cmd = "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$($f.FullName)', [ref]`$null, [ref]`$e) | Out-Null; if (`$e.Count) { `$e | % { `$_.Message }; exit 1 }"
            powershell.exe -NoProfile -Command $cmd
            if ($LASTEXITCODE) { $bad++; Write-Host "::error file=$($f.FullName)::Windows PowerShell 5.1 구문 오류" }
          }
          Write-Host "검사한 파일: $($files.Count)"
          if ($bad) { exit 1 }

      - name: '오프라인 묶음 만들기(GitHub #1 재현 — PATH 첫 python이 실패하는 가짜 pyenv shim, Windows PowerShell 5.1로 collect-offline.ps1 -DashboardRoot)'
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'collect-offline.log'
          $savedPath = $env:PATH
          try {
            # 사용자 PC 재현: pyenv-win shim(전역 버전 미설정)이 PATH 맨 앞 → python 실행이 실패한다
            $shim = Join-Path $env:RUNNER_TEMP 'fake-pyenv-shims'
            New-Item -ItemType Directory -Force -Path $shim | Out-Null
            Set-Content -Path (Join-Path $shim 'python.bat') -Encoding ascii -Value @(
              '@echo off',
              'echo No global/local python version has been set yet. Please set the global version by typing: 1>&2',
              'echo pyenv global 3.7.4 1>&2',
              'exit /b 1')
            # 대시보드 고정 Node 배치(<대시보드>\.tools\node-v22.23.2-win-x64)를 setup-node 설치본 연결로 흉내
            $nodeDir = Split-Path -Parent (Get-Command node -CommandType Application | Select-Object -First 1).Source
            $dashNode = Join-Path $env:DASHBOARD_ROOT ('.tools\node-' + (Get-Content .node-version -Raw).Trim() + '-win-x64')
            if (-not (Test-Path $dashNode)) { New-Item -ItemType Junction -Path $dashNode -Target $nodeDir | Out-Null }
            $env:PATH = "$shim;$env:PATH"
            $first = (Get-Command python -CommandType Application | Select-Object -First 1).Source
            if ($first -ne (Join-Path $shim 'python.bat')) { throw "가짜 shim이 PATH 첫 python이 아닙니다: $first" }
            cmd /c "python -c `"print(1)`" >nul 2>&1"
            if ($LASTEXITCODE -eq 0) { throw '가짜 shim이 실패하지 않습니다(재현 조건 아님)' }
            # 사용자와 같은 명령(Windows PowerShell 5.1 -File). 5.1이 pwsh 7 모듈 경로를 물려받지 않게
            $savedPsm = $env:PSModulePath; $env:PSModulePath = $null
            cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\collect-offline.ps1 -DashboardRoot `"$env:DASHBOARD_ROOT`" 2>&1" | Tee-Object -FilePath $log
            $rc = $LASTEXITCODE; $env:PSModulePath = $savedPsm
            if ($rc) { throw "collect-offline.ps1 실패($rc)" }
          } catch {
            $env:PATH = $savedPath
            if (Test-Path $log) { python scripts/ci_annotate.py $log 'collect-offline 출력' 150 }
            throw
          } finally { $env:PATH = $savedPath }
          # 대시보드 Python 3.12를 골랐는지(콘솔 한글 인코딩과 무관하게 ASCII 경로로 확인)
          $outTxt = Get-Content $log -Raw
          $dashPy = (Get-ChildItem (Join-Path $env:DASHBOARD_ROOT '.tools\python') -Directory -Filter 'cpython-3.12.*' | Select-Object -First 1).FullName + '\python.exe'
          if ($outTxt -notmatch ([regex]::Escape($dashPy) + ' \(Python 3\.12\.\d+\)')) { throw "대시보드 Python 3.12를 고르지 않았습니다: $dashPy" }
          # 프런트는 저장소 빌드본(frontend-dist — Windows autocrlf 체크아웃에서도 해시 일치, phase3 D3-40): Node 선택·npm 없음
          if ($outTxt -notmatch '\+ copy frontend-dist,') { throw '저장소 빌드본 frontend-dist를 쓰지 않았습니다(해시 불일치?)' }
          if ($outTxt -match ' \(Node v22\.' -or $outTxt -match '\+ npm ') { throw '빌드본이 최신인데 Node·npm을 썼습니다' }
          if (-not (Test-Path dist/frontend/BUILD_INFO.json)) { throw '묶음 프런트에 BUILD_INFO.json이 없습니다' }
          # 빌드용 임시 venv는 지워지고 묶음에 들어가지 않는다. 대시보드 런타임에는 설치하지 않는다
          if (Test-Path dist/_buildvenv) { throw 'dist\_buildvenv가 남아 있습니다' }
          $zip = Get-ChildItem physicsai-offline-*.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $names = @($z.Entries | ForEach-Object FullName) } finally { $z.Dispose() }
          if ($names | Where-Object { $_ -match '_buildvenv' }) { throw '묶음에 빌드용 venv가 들어 있습니다' }
          $tops = @($names | ForEach-Object { ($_ -split '[\\/]')[0] } | Sort-Object -Unique)
          Write-Host "묶음 최상위: $($tops -join ', ')"
          if (Compare-Object $tops @('config', 'deploy', 'frontend', 'migrations', 'wheels')) { throw "묶음 최상위 구성이 다릅니다: $($tops -join ', ')" }
          & $dashPy -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('simdash_adapters') or importlib.util.find_spec('fastapi') else 0)"
          if ($LASTEXITCODE) { throw '대시보드 Python에 패키지가 설치되었습니다' }
          if (-not (Test-Path dist/wheels/*.whl)) { throw 'wheels 없음' }
          if (-not (Test-Path dist/wheels/simdash_adapters-0.1.0-py3-none-any.whl)) { throw 'simdash-adapters wheel 없음' }
          if (-not (Test-Path dist/frontend/index.html)) { throw '프런트 빌드 없음' }
          if (-not (Test-Path dist/deploy/demo/fake_tools/fake_hw)) { throw '시연 가짜 도구 없음' }
          Get-ChildItem physicsai-offline-*.zip | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: install.ps1 실제 설치(시연 설정, 임시 폴더, 작업 스케줄러 등록·조회·해제)
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stepLog = Join-Path $env:RUNNER_TEMP ('step-' + [guid]::NewGuid().ToString('N') + '.log')
          try {
            $t = $env:RUNNER_TEMP
            $root = Join-Path $t 'pinstall'
            $port = 8195
            # 시연 설정(가짜 도구·자원)을 설치 대상 config_path에 미리 만든다 → install.ps1은 "기존 설정 유지"
            python deploy/demo/demo_setup.py init --root (Join-Path $t 'pdemo') --port $port --frontend dist/frontend | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { throw 'demo init 실패' }
            $cfgPath = Join-Path $t 'pdemo\config\platform.yaml'
            # 대시보드 환경 재사용(dashboard_root): 가짜 대시보드 .env(POSTGRES_BIN·DATABASE_URL) + .tools 고정 Python 3.12.13
            # → deploy.json에 python_exe·pg_bin·pg_host·pg_port를 쓰지 않아도 대시보드 값으로 채워져야 한다(비밀번호는 읽지 않음)
            $deployJson = @{
              install_root = $root; dashboard_root = $env:DASHBOARD_ROOT
              db_name = 'physicsai'; db_role = 'physicsai_app'; config_path = $cfgPath; service_user = "$env:USERDOMAIN\$env:USERNAME"
              run_mode = 'Interactive'; caddy_frontend_root = (Join-Path $root 'frontend\dist')
            } | ConvertTo-Json
            # 사용자 기본 사용법 재현: -ConfigFile 없이 deploy 폴더의 deploy.json을 읽어야 한다(PS 5.1 param 기본값 $PSScriptRoot 빈 값 회귀 방지, 이슈 #1)
            $jsonPath = Join-Path (Resolve-Path 'dist\deploy') 'deploy.json'
            Set-Content -Path $jsonPath -Value $deployJson -Encoding utf8
            # 무인 설치: 비밀번호는 프로세스 환경변수로만(명령 인자 금지)
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $env:PGPASSWORD
            $env:PHYSICSAI_INSTALL_DB_PASSWORD = [guid]::NewGuid().ToString('N')
            cmd /c "dist\deploy\install.bat -PasswordsFromEnv -NoStart 2>&1" | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { throw "install.bat 실패($LASTEXITCODE)" }
            $instOut = Get-Content $stepLog -Raw
            if (-not $instOut.Contains('pg_bin, pg_host, pg_port, python_exe')) { throw 'dashboard_root 기본값이 채워지지 않았습니다' }
            if ($instOut -notmatch 'PostgreSQL .*18\d{4}') { throw 'install이 PostgreSQL 18 서버를 확인하지 못했습니다' }
            if ($instOut.Contains('simdashboard_app') -or $instOut.Contains($env:DASH_ENV_SECRET)) { throw '대시보드 DB 사용자·비밀번호가 출력에 나왔습니다' }
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $null
            $env:PHYSICSAI_INSTALL_DB_PASSWORD = $null
            # 머신 환경변수를 쓰지 않고 DB 접속 정보는 <install_root>\secrets\database_url(상속 해제 — 현재 사용자·SYSTEM만)
            if ([Environment]::GetEnvironmentVariable('PHYSICSAI_DATABASE_URL', 'Machine') -or [Environment]::GetEnvironmentVariable('PHYSICSAI_CONFIG', 'Machine')) { throw 'install이 머신 환경변수를 썼습니다' }
            $secret = Join-Path $root 'secrets\database_url'
            if (-not (Test-Path $secret)) { throw "DB 접속 정보 파일이 없습니다: $secret" }
            $acl = (icacls (Join-Path $root 'secrets')) -join "`n"
            Write-Host $acl
            if ($acl -match 'BUILTIN\\Users' -or $acl -notmatch 'NT AUTHORITY\\SYSTEM' -or $acl -match '\(I\)') { throw '비밀 폴더 ACL이 제한되지 않았습니다(상속·Users)' }
            # 작업 스케줄러 등록 조회: ExecutionTimeLimit 0(PT0S)·재시작 999·IgnoreNew
            foreach ($n in 'PhysicsAI-Backend', 'PhysicsAI-Worker') {
              $task = Get-ScheduledTask -TaskName $n
              $s = $task.Settings
              Write-Host "$n : ExecutionTimeLimit=$($s.ExecutionTimeLimit) RestartCount=$($s.RestartCount) MultipleInstances=$($s.MultipleInstances) Execute=$($task.Actions[0].Execute) $($task.Actions[0].Arguments) Logon=$($task.Principal.LogonType) RunLevel=$($task.Principal.RunLevel)"
              if ($s.ExecutionTimeLimit -ne 'PT0S') { throw "$n ExecutionTimeLimit=$($s.ExecutionTimeLimit) (PT0S 필요)" }
              # 관리자 권한 없는 설치(phase3 D3-41): 인자 --runtime <install_root> --config <설정>(비밀값 없음), Interactive·Limited
              if ($task.Actions[0].Arguments -notmatch ('--runtime "' + [regex]::Escape($root) + '"') -or $task.Actions[0].Arguments -notmatch '--config ') { throw "$n 인자에 --runtime·--config가 없습니다" }
              if ($task.Actions[0].Arguments -match 'postgres') { throw "$n 인자에 DB URL이 있습니다" }
              if ("$($task.Principal.RunLevel)" -ne 'Limited' -or "$($task.Principal.LogonType)" -ne 'Interactive') { throw "$n 권한 수준·로그온 형식이 다릅니다" }
              if ($s.RestartCount -ne 999) { throw "$n RestartCount=$($s.RestartCount)" }
              if ("$($s.MultipleInstances)" -ne 'IgnoreNew') { throw "$n MultipleInstances=$($s.MultipleInstances)" }
            }
            # 설치된 venv로 백엔드 health(작업 스케줄러 시작 → 안 되면 venv 직접 실행으로 설치본 검증)
            $health = "http://127.0.0.1:$port/physicsai/api/health"
            function Test-Health { try { (Invoke-RestMethod -Uri $health -TimeoutSec 3).status -eq 'ok' } catch { $false } }
            Start-ScheduledTask -TaskName 'PhysicsAI-Backend'
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health }
            $info = Get-ScheduledTaskInfo -TaskName 'PhysicsAI-Backend'
            Write-Host "작업 스케줄러 시작 결과: health=$ok LastTaskResult=$($info.LastTaskResult)"
            $direct = $null
            if (-not $ok) {
              Write-Host '::warning::러너 세션에서 Interactive 작업이 시작되지 않음 — 설치된 venv로 직접 기동해 설치본을 검증합니다'
              Stop-ScheduledTask -TaskName 'PhysicsAI-Backend' -ErrorAction SilentlyContinue
              # 작업과 같은 실행 인자(--runtime) — 환경변수 없이 런타임 파일로 기동해야 한다
              Remove-Item Env:PHYSICSAI_CONFIG, Env:PHYSICSAI_DATABASE_URL -ErrorAction SilentlyContinue
              $direct = Start-Process -FilePath (Join-Path $root 'venv\Scripts\python.exe') -ArgumentList (Get-ScheduledTask -TaskName 'PhysicsAI-Backend').Actions[0].Arguments `
                -WorkingDirectory $root -RedirectStandardOutput (Join-Path $t 'backend.out.log') -RedirectStandardError (Join-Path $t 'backend.err.log') -PassThru
              for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health }
              if (-not $ok) { Get-Content (Join-Path $t 'backend.err.log') -Tail 80; throw '설치본 백엔드 health 실패' }
            }
            Write-Host "health OK: $health"
            if ($direct) { Stop-Process -Id $direct.Id -Force }
            Stop-ScheduledTask -TaskName 'PhysicsAI-Backend' -ErrorAction SilentlyContinue
            # 등록 해제(uninstall-tasks.ps1) → 조회 시 없어야 한다
            $savedPsm = $env:PSModulePath; $env:PSModulePath = $null   # 5.1이 pwsh 7 모듈 경로를 물려받지 않게
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File dist\deploy\uninstall-tasks.ps1
            $env:PSModulePath = $savedPsm
            if ($LASTEXITCODE) { throw 'uninstall-tasks 실패' }
            foreach ($n in 'PhysicsAI-Backend', 'PhysicsAI-Worker') {
              if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "$n 이 남아 있습니다" }
            }
          } catch {
            $msg = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            Write-Host ('::error title=install 예외::' + ($msg -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            if (Test-Path $stepLog) { python scripts/ci_annotate.py $stepLog 'install 출력' 150 }
            foreach ($f in @((Join-Path $env:RUNNER_TEMP 'backend.err.log'))) { if ($f -and (Test-Path $f)) { python scripts/ci_annotate.py $f "install $(Split-Path -Leaf $f)" 60 } }
            throw
          }

      - name: 'git 폴더 설치(GitHub #1 — 사용자 방식 Windows PowerShell 5.1 -File: setup.ps1 → 재실행(idempotent) → update-repo.ps1, 가짜 pyenv shim·가짜 대시보드·가짜 원본 앱·가짜 Altair)'
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'setup-repo.log'
          $savedPath = $env:PATH
          $repo = (Resolve-Path .).Path
          $parent = Split-Path -Parent $repo
          $rt = Join-Path $repo '.runtime'
          $t = $env:RUNNER_TEMP
          $direct = @()
          function Invoke-PS51([string]$Script, [string[]]$Arguments) {
            # 사용자 방식: powershell -NoProfile -ExecutionPolicy Bypass -File (5.1이 pwsh 7 모듈 경로를 물려받지 않게)
            $savedPsm = $env:PSModulePath; $env:PSModulePath = $null
            try {
              $argLine = ($Arguments | ForEach-Object { if ($_ -match '\s') { "`"$_`"" } else { $_ } }) -join ' '
              cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File $Script $argLine 2>&1" | Tee-Object -FilePath $log -Append | Out-Host
              return $LASTEXITCODE
            } finally { $env:PSModulePath = $savedPsm }
          }
          function Test-Health([int]$Port) { try { (Invoke-RestMethod -Uri "http://127.0.0.1:$Port/physicsai/api/health" -TimeoutSec 3).status -eq 'ok' } catch { $false } }
          function Assert-InstalledHealth([string]$Label) {
            # 작업 스케줄러로 시작 → 러너 세션에서 Interactive 작업이 안 뜨면 설치된 venv로 직접 기동(같은 작업 폴더·같은 인자 --runtime, 환경변수 없이)
            $task = Get-ScheduledTask -TaskName 'PhysicsAI-Backend'
            $exe = $task.Actions[0].Execute; $wd = $task.Actions[0].WorkingDirectory; $bArgs = $task.Actions[0].Arguments
            $wArgs = (Get-ScheduledTask -TaskName 'PhysicsAI-Worker').Actions[0].Arguments
            if ($exe -ne (Join-Path $rt 'venv\Scripts\python.exe') -or $wd -ne $rt) { throw "$Label 작업 실행 파일·작업 폴더가 다릅니다: $exe / $wd" }
            if ($bArgs -ne "-m physicsai_api.serve --runtime `"$rt`"" -or $wArgs -ne "-m physicsai_worker --runtime `"$rt`"") { throw "$Label 작업 인자가 다릅니다: $bArgs / $wArgs" }
            if ("$($task.Principal.RunLevel)" -ne 'Limited' -or "$($task.Principal.LogonType)" -ne 'Interactive') { throw "$Label 작업 권한 수준·로그온 형식이 다릅니다" }
            Start-ScheduledTask -TaskName 'PhysicsAI-Backend'
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health 8100 }
            $info = Get-ScheduledTaskInfo -TaskName 'PhysicsAI-Backend'
            Write-Host "::notice title=$Label 작업 스케줄러 시작::health=$ok LastTaskResult=$($info.LastTaskResult)"
            Stop-ScheduledTask -TaskName 'PhysicsAI-Backend' -ErrorAction SilentlyContinue
            Remove-Item Env:PHYSICSAI_CONFIG, Env:PHYSICSAI_DATABASE_URL -ErrorAction SilentlyContinue
            if (-not $ok) {
              $p = Start-Process -FilePath $exe -ArgumentList $bArgs -WorkingDirectory $rt `
                -RedirectStandardOutput (Join-Path $t "setup-backend-$Label.out.log") -RedirectStandardError (Join-Path $t "setup-backend-$Label.err.log") -PassThru
              for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 2; $ok = Test-Health 8100 }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              if (-not $ok) { Get-Content (Join-Path $t "setup-backend-$Label.err.log") -Tail 80; throw "$Label 설치본 백엔드 health 실패" }
            }
            # 워커: 설정 검증(prod, 가짜 Altair·자원)을 통과해 기동 거부(종료코드 2) 없이 돌아야 한다
            $w = Start-Process -FilePath $exe -ArgumentList $wArgs -WorkingDirectory $rt `
              -RedirectStandardOutput (Join-Path $t "setup-worker-$Label.out.log") -RedirectStandardError (Join-Path $t "setup-worker-$Label.err.log") -PassThru
            Start-Sleep 12
            if ($w.HasExited) { Get-Content (Join-Path $t "setup-worker-$Label.err.log") -Tail 60; throw "$Label 워커가 종료되었습니다(종료코드 $($w.ExitCode))" }
            Stop-Process -Id $w.Id -Force
            Write-Host "$Label health OK + 워커 기동 OK"
          }
          try {
            # ---- 사용자 PC 재현: 대시보드는 <git 부모>\simdashboard(.env·.tools Python 3.12·Node 22), 원본 앱 폴더, Altair, 망가진 pyenv shim ----
            $dashLink = Join-Path $parent 'simdashboard'
            if (-not (Test-Path $dashLink)) { New-Item -ItemType Junction -Path $dashLink -Target $env:DASHBOARD_ROOT | Out-Null }
            $nodeDir = Split-Path -Parent (Get-Command node -CommandType Application | Select-Object -First 1).Source
            $dashNode = Join-Path $env:DASHBOARD_ROOT ('.tools\node-' + (Get-Content .node-version -Raw).Trim() + '-win-x64')
            if (-not (Test-Path $dashNode)) { New-Item -ItemType Junction -Path $dashNode -Target $nodeDir | Out-Null }
            $orig = Join-Path $t 'OPEN_SOURCE_physics_ai_platform'
            foreach ($rel in 'CONFIG\BATCHRUN\BATCHRUN_preview_pred_h3d.tcl', 'CONFIG\BATCHRUN\BATCHRUN_create_include_node_elem.tcl', 'CONFIG\BATCHRUN\BATCHRUN_preview_h3d.tcl',
                             'CONFIG\BATCHRUN\BATCHRUN_preview_hg.tcl', 'CONFIG\BATCHRUN\BATCHRUN_curate_hg.tcl', 'CONFIG\BATCHRUN\H3D_StaticMinMax_to_CSV_FAST.tcl',
                             'CONFIG\TEMPLATE\TEMAPLATE_simlab_parametered_mesh.tpl', 'CONFIG\DATA\DATA_doe_design_type.json', 'BUILD_PYD\get_parameter_from_cad_core.cp312-win_amd64.pyd') {
              $f = Join-Path $orig $rel; New-Item -ItemType Directory -Force -Path (Split-Path -Parent $f) | Out-Null; Set-Content -Path $f -Value 'fake' -Encoding ascii
            }
            $altair = Join-Path $t 'fake-altair'
            foreach ($rel in 'hwdesktop\hst\bin\win64\hstbatch.exe', 'SimLab\bin\win64\SimLab.bat', 'common\eds\win64\bin\win64\edspy.bat', 'hwdesktop\hw\bin\win64\hw.exe', 'hwdesktop\io\result_readers\bin\win64\hvtrans.exe') {
              $f = Join-Path $altair "2026.1\$rel"; New-Item -ItemType Directory -Force -Path (Split-Path -Parent $f) | Out-Null; Set-Content -Path $f -Value 'fake' -Encoding ascii
            }
            $shim = Join-Path $t 'fake-pyenv-shims'
            New-Item -ItemType Directory -Force -Path $shim | Out-Null
            Set-Content -Path (Join-Path $shim 'python.bat') -Encoding ascii -Value @('@echo off', 'echo No global/local python version has been set yet. Please set the global version by typing: 1>&2', 'exit /b 1')
            $env:PATH = "$shim;$env:PATH"
            # 깨끗한 PC처럼: 이전 단계(install.ps1)의 머신 환경변수·DB·역할을 지운다
            [Environment]::SetEnvironmentVariable('PHYSICSAI_CONFIG', $null, 'Machine')
            [Environment]::SetEnvironmentVariable('PHYSICSAI_DATABASE_URL', $null, 'Machine')
            & (Join-Path $env:PGBIN 'psql.exe') -h 127.0.0.1 -p $env:PG_PORT -U $env:PGUSER -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS physicsai WITH (FORCE)' -c 'DROP ROLE IF EXISTS physicsai_app'
            if ($LASTEXITCODE) { throw 'DB 정리 실패' }

            # ---- ① 설치: 인자는 원본 앱·Altair 위치만(대시보드·AI 루트는 git 폴더 부모 기준 기본값) ----------------------
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $env:PGPASSWORD
            $env:PHYSICSAI_INSTALL_DB_PASSWORD = 'Ci-' + [guid]::NewGuid().ToString('N')
            Write-Host "::add-mask::$env:PHYSICSAI_INSTALL_DB_PASSWORD"
            $rc = Invoke-PS51 '.\deploy\setup.ps1' @('-NonInteractive', '-PasswordsFromEnv', '-NoStart', '-OriginalAppRoot', $orig, '-AltairRoot', $altair)
            if ($rc) { throw "setup.ps1 실패($rc)" }
            $env:PHYSICSAI_INSTALL_PG_ADMIN_PASSWORD = $null; $env:PHYSICSAI_INSTALL_DB_PASSWORD = $null
            $dj = Get-Content (Join-Path $rt 'deploy.json') -Raw | ConvertFrom-Json
            Write-Host ($dj | ConvertTo-Json)
            if ($dj.dashboard_root -ne $dashLink) { throw "대시보드 기본값이 <git 부모>\simdashboard가 아닙니다: $($dj.dashboard_root)" }
            if ($dj.ai_root -ne (Join-Path $parent 'physicsai-data') -or -not (Test-Path $dj.ai_root)) { throw "AI 루트 기본값이 다르거나 폴더가 없습니다: $($dj.ai_root)" }
            if ([int]$dj.pg_port -ne [int]$env:PG_PORT -or $dj.run_mode -ne 'Interactive') { throw "pg_port·run_mode 기본값이 다릅니다" }
            $dashPyDir = @(Get-ChildItem (Join-Path $env:DASHBOARD_ROOT '.tools\python') -Directory -Filter 'cpython-3.12.*')[0].FullName
            $cfgTxt = Get-Content (Join-Path $rt 'venv\pyvenv.cfg') -Raw
            if ($cfgTxt -notmatch ('(?im)^home\s*=\s*(' + [regex]::Escape($dashPyDir) + '|' + [regex]::Escape(($dashPyDir -replace [regex]::Escape($env:DASHBOARD_ROOT), $dashLink)) + ')\s*$')) { Write-Host $cfgTxt; throw 'venv가 대시보드 Python 3.12로 만들어지지 않았습니다(가짜 pyenv shim을 골랐을 수 있음)' }
            & (Join-Path $dashPyDir 'python.exe') -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('fastapi') else 0)"
            if ($LASTEXITCODE) { throw '대시보드 Python에 패키지가 설치되었습니다' }
            $cfgPath = Join-Path $rt 'config\platform.yaml'
            # 관리자 권한 없는 설치(phase3 D3-41): 머신 환경변수를 쓰지 않고 DB 접속 정보는 .runtime\secrets\database_url(상속 해제 — 현재 사용자·SYSTEM만)
            if ([Environment]::GetEnvironmentVariable('PHYSICSAI_CONFIG', 'Machine') -or [Environment]::GetEnvironmentVariable('PHYSICSAI_DATABASE_URL', 'Machine')) { throw 'setup.ps1이 머신 환경변수를 썼습니다' }
            $secret = Join-Path $rt 'secrets\database_url'
            if (-not (Test-Path $secret)) { throw "DB 접속 정보 파일이 없습니다: $secret" }
            $acl = (icacls (Join-Path $rt 'secrets')) -join "`n"
            Write-Host $acl
            if ($acl -match 'BUILTIN\\Users' -or $acl -notmatch 'NT AUTHORITY\\SYSTEM' -or $acl -match '\(I\)') { throw '비밀 폴더 ACL이 제한되지 않았습니다(상속·Users)' }
            # 프런트는 저장소 빌드본(frontend-dist, Windows autocrlf 체크아웃에서도 해시 일치 — D3-40): Node·npm 없이 배치
            if (-not (Test-Path (Join-Path $rt 'frontend\BUILD_INFO.json'))) { throw '저장소 빌드본(frontend-dist)이 배치되지 않았습니다(해시 불일치로 npm 빌드?)' }
            if ((Get-Content $log -Raw) -match '\+ npm (ci|run build)') { throw 'frontend-dist가 최신인데 setup.ps1이 npm을 실행했습니다' }
            $py = Join-Path $rt 'venv\Scripts\python.exe'
            & $py -c "import sys, yaml; c = yaml.safe_load(open(sys.argv[1], encoding='utf-8')); r = c['resources']; a = c['altair']; ok = c['profile'] == 'prod' and c['hpc']['gateway'] == 'none' and c['server']['port'] == 8100 and a['version_label'] == '2026.1' and all(a[k] for k in ('hyperstudy_path', 'simlab_path', 'edspy_path', 'hw_exe_path', 'hvtrans_exe_path')) and all(r[k] for k in r if k != 'launchers') and c['auth']['dashboard_public_login_url'] == '/home/'; print(r); sys.exit(0 if ok else 1)" $cfgPath
            if ($LASTEXITCODE) { throw 'platform.yaml 생성 값이 다릅니다' }
            if (-not (Test-Path (Join-Path $rt 'frontend\index.html'))) { throw '프런트 배치 없음' }
            foreach ($n in 'PhysicsAI-Backend', 'PhysicsAI-Worker') {
              $s = (Get-ScheduledTask -TaskName $n).Settings
              if ($s.ExecutionTimeLimit -ne 'PT0S' -or $s.RestartCount -ne 999 -or "$($s.MultipleInstances)" -ne 'IgnoreNew') { throw "$n 작업 설정이 다릅니다" }
            }
            $dirty = git status --porcelain
            if ($dirty) { Write-Host $dirty; throw 'git 폴더에 추적되지 않은 파일·변경이 생겼습니다(.runtime·build는 git 제외여야 함)' }
            Assert-InstalledHealth 'setup'

            # ---- ② 다시 실행(idempotent): 비밀번호 환경변수 없이(기존 DB 연결 재사용), 사용자 수정값 유지 -------------------------
            (Get-Content $cfgPath -Raw -Encoding UTF8).Replace('max_logical_cores: 32', 'max_logical_cores: 7') | Set-Content -Path $cfgPath -Encoding UTF8 -NoNewline
            $djHash = (Get-FileHash (Join-Path $rt 'deploy.json')).Hash
            $cfgHash = (Get-FileHash $cfgPath).Hash
            $rc = Invoke-PS51 '.\deploy\setup.ps1' @('-NonInteractive', '-NoStart', '-OriginalAppRoot', $orig, '-AltairRoot', $altair)
            if ($rc) { throw "setup.ps1 재실행 실패($rc)" }
            if ((Get-FileHash (Join-Path $rt 'deploy.json')).Hash -ne $djHash) { throw '재실행에서 deploy.json이 바뀌었습니다' }
            if ((Get-FileHash $cfgPath).Hash -ne $cfgHash) { throw '재실행에서 platform.yaml이 바뀌었습니다(사용자 수정값 유지 실패)' }
            if (-not (Get-ChildItem (Join-Path $rt '_backup') -Recurse -Filter 'PhysicsAI-Backend.xml')) { throw '재실행 전 작업 정의 백업이 없습니다' }
            if (git status --porcelain) { throw '재실행 후 git 폴더가 깨끗하지 않습니다' }
            Assert-InstalledHealth 'setup-rerun'

            # ---- ③ 업데이트(명령 하나, git pull 포함): 이전 설치 이전(머신 환경변수 DB URL → 런타임 파일) → 대기열 확인 → 중지 → venv 갱신 → 프런트 배치 → alembic ----
            # 이전 설치(관리자 권한 — 머신 환경변수) 흉내: 런타임 DB 파일을 치우고 머신 환경변수에만 둔다(러너는 관리자라 쓸 수 있음)
            $moved = Join-Path $t 'database_url.moved'
            Move-Item $secret $moved -Force
            [Environment]::SetEnvironmentVariable('PHYSICSAI_DATABASE_URL', (Get-Content $moved -Raw).Trim(), 'Machine')
            '--- update-repo ---' | Add-Content $log
            $rc = Invoke-PS51 '.\deploy\update-repo.ps1' @('-NoStart')   # 인자·질문 없음(phase3 D3-39) — -NoStart만(러너 작업 스케줄러)
            [Environment]::SetEnvironmentVariable('PHYSICSAI_DATABASE_URL', $null, 'Machine')
            if ($rc) { throw "update-repo.ps1 실패($rc)" }
            $updOut = ((Get-Content $log -Raw) -split '--- update-repo ---')[-1]
            if (-not (Test-Path $secret) -or (Get-Content $secret -Raw).Trim() -ne (Get-Content $moved -Raw).Trim()) { throw '머신 환경변수 DB URL이 런타임 파일로 옮겨지지 않았습니다' }
            if ($updOut -match '\+ npm (ci|run build)') { throw 'frontend-dist가 최신인데 update-repo.ps1이 npm을 실행했습니다' }
            if (-not (Test-Path (Join-Path $rt 'frontend\index.html'))) { throw '업데이트 후 프런트 배치 없음' }
            if (-not (Get-ChildItem (Join-Path $rt '_backup') -Directory -Recurse -Filter 'frontend')) { throw '이전 프런트가 _backup으로 옮겨지지 않았습니다' }
            if ((Get-FileHash $cfgPath).Hash -ne $cfgHash) { throw '업데이트에서 platform.yaml이 바뀌었습니다' }
            if (git status --porcelain) { throw '업데이트 후 git 폴더가 깨끗하지 않습니다' }
            Assert-InstalledHealth 'update-repo'
          } catch {
            $env:PATH = $savedPath
            $msg = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            Write-Host ('::error title=git 폴더 설치 예외::' + ($msg -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            if (Test-Path $log) { python scripts/ci_annotate.py $log 'setup·update-repo 출력' 150 }
            foreach ($f in @(Get-ChildItem $t -Filter 'setup-*.err.log' -ErrorAction SilentlyContinue | ForEach-Object FullName)) { python scripts/ci_annotate.py $f "$(Split-Path -Leaf $f)" 60 }
            throw
          } finally {
            $env:PATH = $savedPath
            $savedPsm = $env:PSModulePath; $env:PSModulePath = $null
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy\uninstall-tasks.ps1
            $env:PSModulePath = $savedPsm
          }

      - name: '저장소 모드 시연(GitHub #1 재현 — PATH 첫 python이 실패하는 가짜 pyenv shim, -DashboardRoot의 Python 3.12 → <DemoRoot>\venv) → API로 ①-1 → stop-demo.bat'
        if: ${{ !cancelled() }}
        env:
          PHYSICSAI_NO_PAUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $stepLog = Join-Path $env:RUNNER_TEMP ('step-' + [guid]::NewGuid().ToString('N') + '.log')
          $savedPath = $env:PATH
          try {
            $demo = Join-Path $env:RUNNER_TEMP 'demo'
            $port = 8196
            # 사용자 PC 재현: pyenv-win shim(전역 버전 미설정)이 PATH 맨 앞 → python 실행이 실패한다
            $shim = Join-Path $env:RUNNER_TEMP 'fake-pyenv-shims'
            New-Item -ItemType Directory -Force -Path $shim | Out-Null
            Set-Content -Path (Join-Path $shim 'python.bat') -Encoding ascii -Value @(
              '@echo off',
              'echo No global/local python version has been set yet. Please set the global version by typing: 1>&2',
              'echo pyenv global 3.7.4 1>&2',
              'exit /b 1')
            $env:PATH = "$shim;$env:PATH"
            $first = (Get-Command python -CommandType Application | Select-Object -First 1).Source
            if ($first -ne (Join-Path $shim 'python.bat')) { throw "가짜 shim이 PATH 첫 python이 아닙니다: $first" }
            cmd /c "python -c `"print(1)`" >nul 2>&1"
            if ($LASTEXITCODE -eq 0) { throw '가짜 shim이 실패하지 않습니다(재현 조건 아님)' }
            if (Test-Path (Join-Path $PWD 'wheels')) { throw '저장소 루트에 wheels가 있으면 묶음 모드가 됩니다' }
            cmd /c "deploy\demo\start-demo.bat -DemoRoot $demo -Port $port -DashboardRoot `"$env:DASHBOARD_ROOT`" -PgPort 55433 -NoBrowser -ToolDelay 0 2>&1" | Tee-Object -FilePath $stepLog -Append
            if ($LASTEXITCODE) { Get-ChildItem "$demo\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }; throw "start-demo 실패($LASTEXITCODE)" }
            # 시연 venv는 대시보드 Python 3.12로 만들어져야 한다(pyvenv.cfg home — 콘솔 한글 인코딩과 무관하게 파일로 확인)
            $dashPyDir = @(Get-ChildItem (Join-Path $env:DASHBOARD_ROOT '.tools\python') -Directory -Filter 'cpython-3.12.*')[0].FullName
            $cfgTxt = Get-Content (Join-Path $demo 'venv\pyvenv.cfg') -Raw
            Write-Host $cfgTxt
            if ($cfgTxt -notmatch ('(?im)^home\s*=\s*' + [regex]::Escape($dashPyDir) + '\s*$')) { throw "시연 venv가 대시보드 Python 3.12로 만들어지지 않았습니다" }
            $stamp = Join-Path $demo 'venv\physicsai-repo-deps.sha256'
            if (-not (Test-Path $stamp)) { throw '의존성 설치 기록 파일이 없습니다' }
            $stampTime = (Get-Item $stamp).LastWriteTimeUtc
            # 대시보드 런타임에는 설치하지 않는다(fastapi가 없어야 한다)
            $dashPy = Join-Path $dashPyDir 'python.exe'
            & $dashPy -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('fastapi') else 0)"
            if ($LASTEXITCODE) { throw '대시보드 Python에 fastapi가 설치되었습니다' }
            try {
              $base = "http://127.0.0.1:$port"
              $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
              Invoke-WebRequest "$base/physicsai/api/demo/login" -Method Post -Body @{ role = 'power' } -WebSession $s | Out-Null
              $st = Invoke-RestMethod "$base/physicsai/api/status" -WebSession $s
              if (-not $st.demo) { throw '/status.demo가 true가 아닙니다' }
              for ($i = 0; $i -lt 30 -and -not $st.worker.online; $i++) { Start-Sleep 1; $st = Invoke-RestMethod "$base/physicsai/api/status" -WebSession $s }
              Write-Host "worker online=$($st.worker.online) limiter=$($st.worker.limiter)"
              if ($st.worker.limiter -ne 'windows_job') { throw "Windows 제한기가 아닙니다: $($st.worker.limiter)" }
              $studies = @(Invoke-RestMethod "$base/physicsai/api/studies?project_id=demo" -WebSession $s | ForEach-Object { $_ })
              $sid = ($studies | Where-Object { $_.folder_name -eq 'demo_bracket' } | Select-Object -First 1).id
              if (-not $sid) { throw "시연 Study를 찾지 못했습니다: $($studies | ConvertTo-Json -Depth 3 -Compress)" }
              $cad = ($demo -replace '\\', '/') + '/ai_root/demo_bracket/00_inbox/cad/demo_bracket.prt'
              $body = @{ job_type = 'TD_EXTRACT_PARAMS'; params = @{ cad_path = $cad } } | ConvertTo-Json
              $j = Invoke-RestMethod "$base/physicsai/api/studies/$sid/jobs" -Method Post -WebSession $s -Headers @{ 'X-PhysicsAI-Request' = '1' } -ContentType 'application/json; charset=utf-8' -Body $body
              for ($i = 0; $i -lt 60; $i++) {
                Start-Sleep 1
                $jd = Invoke-RestMethod "$base/physicsai/api/jobs/$($j.id)" -WebSession $s
                if ($jd.state -in 'SUCCEEDED', 'FAILED', 'CANCELED', 'INTERRUPTED') { break }
              }
              Write-Host "①-1 결과: $($jd.state) $($jd.failure_code) $($jd.failure_message)"
              if ($jd.state -ne 'SUCCEEDED') { $jd | ConvertTo-Json -Depth 6; throw '시연 ①-1 실패' }
            } finally {
              cmd /c "deploy\demo\stop-demo.bat -DemoRoot $demo"
            }
            # 다시 시작: 의존성은 기록 해시로 건너뛴다(시연 venv 재사용)
            # GitHub #1 재현: 회사 PC처럼 HTTP_PROXY·HTTPS_PROXY가 닫힌 포트(127.0.0.1:9)를 가리켜도 루프백 health·seed·확인이 통과해야 한다
            $log2 = Join-Path $env:RUNNER_TEMP 'demo-restart.log'
            $savedProxy = @{ HTTP_PROXY = $env:HTTP_PROXY; HTTPS_PROXY = $env:HTTPS_PROXY; NO_PROXY = $env:NO_PROXY }
            try {
              $env:HTTP_PROXY = 'http://127.0.0.1:9'; $env:HTTPS_PROXY = 'http://127.0.0.1:9'; $env:NO_PROXY = $null
              cmd /c "deploy\demo\start-demo.bat -DemoRoot $demo -Port $port -DashboardRoot `"$env:DASHBOARD_ROOT`" -PgPort 55433 -NoBrowser -ToolDelay 0 2>&1" | Tee-Object -FilePath $log2
              if ($LASTEXITCODE) { Get-Content $log2 -Tail 40; throw "start-demo 재시작(HTTP_PROXY 닫힌 포트) 실패($LASTEXITCODE)" }
              if ((Get-Item $stamp).LastWriteTimeUtc -ne $stampTime) { throw '재시작에서 의존성 설치를 건너뛰지 않았습니다(기록 파일이 다시 쓰임)' }
              $h = "http://127.0.0.1:$port/physicsai/api/health"
              . .\deploy\loopback-http.ps1
              if ((Invoke-LoopbackRest -Uri $h -TimeoutSec 5).status -ne 'ok') { throw 'pwsh 7 Invoke-LoopbackRest health 실패(프록시 환경)' }
              $savedPsm = $env:PSModulePath; $env:PSModulePath = $null   # 5.1이 pwsh 7 모듈 경로를 물려받지 않게
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". .\deploy\loopback-http.ps1; if ((Invoke-LoopbackRest -Uri '$h' -TimeoutSec 5).status -ne 'ok') { exit 1 }"
              $rc51 = $LASTEXITCODE; $env:PSModulePath = $savedPsm
              if ($rc51) { throw 'Windows PowerShell 5.1 Invoke-LoopbackRest health 실패(프록시 환경)' }
              Write-Host 'HTTP_PROXY 닫힌 포트 환경: 시연 기동·health(pwsh 7·5.1) OK'
            } finally {
              foreach ($k in $savedProxy.Keys) { Set-Item "env:$k" -Value $savedProxy[$k] -ErrorAction SilentlyContinue; if (-not $savedProxy[$k]) { Remove-Item "env:$k" -ErrorAction SilentlyContinue } }
              cmd /c "deploy\demo\stop-demo.bat -DemoRoot $demo"
            }
          } catch {
            $env:PATH = $savedPath
            $msg = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            Write-Host ('::error title=demo 예외::' + ($msg -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            if (Test-Path $stepLog) { python scripts/ci_annotate.py $stepLog 'demo 출력' 150 }
            foreach ($f in @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'demo\logs') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object FullName)) { if ($f -and (Test-Path $f)) { python scripts/ci_annotate.py $f "demo $(Split-Path -Leaf $f)" 60 } }
            throw
          }
