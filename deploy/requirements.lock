# PhysicsAI 런타임 의존성 고정 버전(Windows x64, Python 3.13). pyproject.toml 하한을 만족하는 정확 버전.
# 생성 방법(인터넷 되는 준비 PC): 깨끗한 venv에서 `pip install .` 후 `pip freeze --exclude-editable` 결과에서
# physicsai-platform을 빼고, Windows 전용 의존성(colorama·tzdata)을 포함해 고정한다.
# 검증: pip download -r deploy/requirements.lock --only-binary=:all: --platform win_amd64 --python-version 3.13 이 추가 패키지 없이 끝나야 한다. 갱신 시 시험(scripts/test-all) 재실행.
