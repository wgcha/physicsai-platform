# PhysicsAI 런타임 의존성 고정 버전(Windows x64, Python 3.12 — 대시보드와 같은 3.12.13, cp312 win_amd64). pyproject.toml 하한을 만족하는 정확 버전.
# 생성 방법(인터넷 되는 준비 PC): 깨끗한 venv에서 `pip install .` 후 `pip freeze --exclude-editable` 결과에서
# physicsai-platform을 빼고, Windows 전용 의존성(colorama·tzdata)을 포함해 고정한다.
# 이 파일은 PyPI에서 받는 외부 의존성만 담는다. 저장소 안 패키지 simdash-adapters는 PyPI 이름 선점을 막기 위해 여기에 두지 않고
#   deploy/requirements.local.lock에 고정한다(로컬 wheel만, 항상 --no-index로 확인·설치). 개발·CI는 packages/simdash_adapters를 먼저 설치한다.
# 검증: pip download -r deploy/requirements.lock --only-binary=:all: --platform win_amd64 --python-version 3.12 이 추가 패키지 없이 끝나야 한다. 갱신 시 시험(scripts/test-all) 재실행.
# 빌드 백엔드(이슈 #9): setuptools는 저장소 안 3개 패키지(simdash_adapters·paicad·플랫폼)를 `pip install --no-build-isolation`으로 설치할 때 venv에서 쓰는 빌드 도구다.
#   각 pyproject의 build-system(setuptools>=68)을 pip 빌드 격리가 인덱스에서 받으려다 폐쇄망·프록시에서 실패하던 문제를 막는다 — 이 lock을 로컬 패키지보다 먼저 설치한다.
#   setuptools>=70.1은 bdist_wheel을 내장해 wheel 패키지가 필요 없다(고정하지 않음). Python 3.12·py3-none-any(Windows 오프라인 묶음에도 그대로 포함).
# MCP 서버(docs/contracts/mcp.md MR-14·MR-18): mcp==2.3.0과 전이 의존(아래 attrs·cffi·cryptography·httpcore2·httpx2·jsonschema*·mcp-types·pycparser·PyJWT·
#   python-multipart·pywin32(Windows 전용)·referencing·rpds-py·sse-starlette·truststore)을 정확 고정. python-multipart는 SDK 전이 의존으로만 — 플랫폼 코드 import·multipart 라우트 0(test_layering).
