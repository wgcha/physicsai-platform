[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicsai-platform"
version = "0.1.0"
description = "PhysicsAI 플랫폼 1차 (백엔드·워커)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[tool.setuptools.packages.find]
where = ["backend", "worker"]
include = ["physicsai_core*", "physicsai_api*", "physicsai_worker*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "worker/tests"]
pythonpath = ["backend", "worker"]
addopts = "--import-mode=importlib -p no:cacheprovider"
timeout = 180
markers = [
  "windows: Windows 전용 시험(Job Object). Linux에서는 skip — 통과로 기록하지 않는다",
]
